}
const gen = new THREE.Group(); { const b = new THREE.Mesh(new THREE.BoxGeometry(.5, .42, .3), new THREE.MeshStandardMaterial({ color: '#8b2e1f', roughness: .6 })); b.position.y = .21; b.castShadow = true; gen.add(b);
  gen.position.set(7.4, 0, 1.2); scene.add(gen);
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(7.15, .02, 1.2), new THREE.Vector3(5, .015, 1.6), new THREE.Vector3(3.2, .015, 1.3), new THREE.Vector3(2.25, .07, 1.4), new THREE.Vector3(1.75, .1, 1.45)]);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .008, 5), new THREE.MeshStandardMaterial({ color: '#d47a1f' }))); }

// ---------- sky + lights ----------
const skyU = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, bot: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 hor; uniform vec3 bot; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h>0. ? mix(hor, top, pow(clamp(h,0.,1.),.55)) : mix(hor, bot, clamp(-h*4.,0.,1.)); gl_FragColor = vec4(c,1.); }' }));
scene.add(sky);
const hemi = new THREE.HemisphereLight('#ffffff', '#6b5a40', 1); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 2); sun.castShadow = true;
const SM = mobile ? 2048 : 4096; sun.shadow.mapSize.set(SM, SM); const sc = sun.shadow.camera; sc.left = -8; sc.right = 8; sc.top = 8; sc.bottom = -8; sc.near = 1; sc.far = 60;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = .02; sun.shadow.radius = 4; scene.add(sun, sun.target);
const podLight = new THREE.PointLight('#ffb15e', 0, 2.3, 1.6); podLight.position.set(D.POD.cx, 1.95, 0); scene.add(podLight);
const podSpill = new THREE.SpotLight('#ffb466', 0, 9, .95, .7, 1.4); podSpill.position.set(D.POD.cx - .5, 2.0, 0); podSpill.target.position.set(3.0, 0, .3);
podSpill.castShadow = true; podSpill.shadow.mapSize.set(1024, 1024); podSpill.shadow.bias = -.001; scene.add(podSpill, podSpill.target);
const roofGlow = new THREE.PointLight('#ffb466', 0, 4.5, 1.5); roofGlow.position.set(D.POD.cx, 2.95, 0); scene.add(roofGlow);
const bulb = new THREE.Mesh(new THREE.SphereGeometry(.06, 12, 8), new THREE.MeshBasicMaterial({ color: '#ffd9a0' })); bulb.position.set(D.POD.cx, 2.2, 0); groups.pod.add(bulb);
const cord = new THREE.Mesh(new THREE.CylinderGeometry(.004, .004, .27), MAT.steel); cord.position.set(D.POD.cx, 2.36, 0); groups.pod.add(cord);
const kilnPeep = scene.getObjectByName('peephole');

const LIGHTS = {
  day: { sun: [5, 13, 8], sunC: '#fff6e8', sunI: 2.6, hemiS: '#d6e6f3', hemiG: '#7a6a4c', hemiI: 1.0, top: '#7fa9d6', hor: '#e8eef0', bot: '#5a5040', exp: 1.0, pod: 0, fog: '#d9e2e4' },
  golden: { sun: [-7.5, 3.0, 9.5], sunC: '#ffad5c', sunI: 3.4, hemiS: '#ffd8b0', hemiG: '#5a4430', hemiI: .62, top: '#6f86b0', hor: '#ffc68a', bot: '#4a3a2a', exp: 1.05, pod: .35, fog: '#e9c39a' },
  night: { sun: [-6, 11, -7], sunC: '#9fb4ff', sunI: .14, hemiS: '#30406a', hemiG: '#141210', hemiI: .2, top: '#05081a', hor: '#1b2544', bot: '#07070a', exp: 1.15, pod: 1, fog: '#121a30' },
};
scene.fog = new THREE.Fog('#d9e2e4', 22, 80);
let lightMode = 'golden';
function setLight(k) {
  lightMode = k; const L = LIGHTS[k];
  sun.position.set(...L.sun).multiplyScalar(2); sun.color.set(L.sunC); sun.intensity = L.sunI;
  hemi.color.set(L.hemiS); hemi.groundColor.set(L.hemiG); hemi.intensity = L.hemiI;
  skyU.top.value.set(L.top); skyU.hor.value.set(L.hor); skyU.bot.value.set(L.bot); scene.fog.color.set(L.fog);
  renderer.toneMappingExposure = L.exp;
  podLight.intensity = L.pod * 9; podSpill.intensity = L.pod * 26; roofGlow.intensity = L.pod * 7;
  MAT.poly.emissiveIntensity = L.pod * 1.6; MAT.poly.opacity = k === 'night' ? .9 : .62;
  bulb.material.color.set(L.pod > .5 ? '#ffe2b0' : '#d8cdb8');
  if (kilnPeep) kilnPeep.material.color.set(k === 'night' ? '#ff8a2a' : '#7a4a2a');
  document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === k));
}

// ---------- state: wall, explode, steps ----------
let wallT = P.get('wall') === 'closed' ? 0 : 1, wallGoal = wallT;
let expT = P.get('explode') === '1' ? 1 : 0, expGoal = expT;
let step = +(P.get('step') || 0), stepT = 1;
const A = 86 * Math.PI / 180;
function applyWall(t) { const e = t * t * (3 - 2 * t);
  for (const lp of leafPivots) { lp.h1.rotation.y = lp.sign * e * A; if (lp.h2) lp.h2.rotation.y = -lp.sign * 2 * e * A; } }
function applyState() {
  const e = expT * expT * (3 - 2 * expT);
  const st = step, s = stepT * stepT * (3 - 2 * stepT);
  for (const it of items) {
    const vis = !st || it.step <= st; it.obj.visible = vis;
    const p = it.base.clone().addScaledVector(it.exp, st ? 0 : e);
    if (st && it.step === st && st !== 3) p.y += (1 - s) * 1.6;
    it.obj.position.copy(p);
  }
  for (const p of pegs) p.obj.visible = (!st || p.step <= st) && e < .02;
  // bents: step 2 shows bent 1 assembled flat; step 3 raises it and adds bents 2 + 3
  bentPivot.forEach((g, i) => {
    let rot = 0, vis = true;
    if (st === 2) { vis = i === 0; rot = Math.PI / 2; }
    if (st === 3 && i === 0) rot = (1 - s) * Math.PI / 2;
    if (st === 3 && i > 0) { g.position.y = D.PAD_TOP + (1 - s) * 1.6; } else g.position.y = D.PAD_TOP;
    if (st && st < 2) vis = false;
    g.rotation.z = rot; g.visible = vis;
  });
  fig.visible = !st || st >= 9 || st === 3;
  const sb = document.getElementById('stepbar');
  sb.classList.toggle('show', !!st);
  if (st) { const S = D.STEPS[st - 1]; document.getElementById('stepTxt').innerHTML = `<b>${S.n}/9 · ${S.title}</b> <span style="opacity:.7">(${S.crew})</span><br>${S.text}`; }
  document.getElementById('bSteps').classList.toggle('on', !!st);
  document.getElementById('bExp').classList.toggle('on', expGoal === 1);
}
const wallBtn = document.getElementById('bWall');
function setWallBtn() { wallBtn.innerHTML = (wallGoal ? 'Close wall' : 'Open wall') + '<small>bi-fold</small>'; wallBtn.classList.toggle('on', !!wallGoal); }
wallBtn.onclick = () => { wallGoal = wallGoal ? 0 : 1; setWallBtn(); };
document.getElementById('bExp').onclick = () => { step = 0; expGoal = expGoal ? 0 : 1; applyState(); };
document.getElementById('bSteps').onclick = () => { expGoal = expT = 0; step = step ? 0 : 1; stepT = 0; applyState(); if (view === 'inside') setView('hero'); };
document.getElementById('sPrev').onclick = () => { step = step > 1 ? step - 1 : 9; stepT = 0; applyState(); };
document.getElementById('sNext').onclick = () => { step = step < 9 ? step + 1 : 1; stepT = 0; applyState(); };
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => setLight(b.dataset.l));

// ---------- cameras ----------
let view = P.get('view') || 'hero';
const viewBtn = document.getElementById('bView');
function fit() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = view === 'inside' ? (w < h ? 78 : 62) : (w < h ? 50 : 36); camera.updateProjectionMatrix();
}
function setView(v) {
  view = v; fit();
  const hud = document.body.classList.contains('noui') ? [0, 0] : [document.querySelector('header').offsetHeight, document.querySelector('nav').offsetHeight];
  if (v === 'inside') {
    controls.minDistance = .05; controls.maxDistance = 6; controls.maxPolarAngle = Math.PI * .8;
    camera.position.set(-1.75, 0.277 + 1.6, -0.35); controls.target.set(2.4, 1.15, 1.05);
    camera.clearViewOffset();
  } else {
    controls.minDistance = 1.5; controls.maxDistance = 40; controls.maxPolarAngle = Math.PI * .495;
    const name = v; const dirs = { hero: [1.0, .42, 1.05], exploded: [1.0, .55, 1.1] };
    const dir = new THREE.Vector3(...(dirs[name] || dirs.hero)).normalize();
    const R = expGoal ? 6.4 : 4.6, tgt = new THREE.Vector3(.2, expGoal ? 2.6 : 1.75, .2);
    const vv = THREE.MathUtils.degToRad(camera.fov) / 2, hh = Math.atan(Math.tan(vv) * camera.aspect);
    const usable = Math.max(.5, 1 - (hud[0] + hud[1]) / innerHeight), vu = Math.atan(Math.tan(vv) * usable);

    controls.target.copy(tgt); camera.position.copy(tgt).addScaledVector(dir, dist);

  viewBtn.innerHTML = v === 'inside' ? 'Outside<small>3/4 view</small>' : 'Inside<small>eye height</small>';
  viewBtn.classList.toggle('on', v === 'inside');
}
viewBtn.onclick = () => setView(view === 'inside' ? 'hero' : 'inside');
addEventListener('resize', () => setView(view));

// ---------- GLB export (used to make pavilion-pod.glb) ----------
window.exportGLB = async () => {
  const { GLTFExporter } = await import('./vendor/GLTFExporter.js');
  const { mergeGeometries } = await import('./vendor/BufferGeometryUtils.js');
  model.updateMatrixWorld(true);
  const byMat = new Map();
  model.traverse(o => { if (!o.isMesh || !o.visible) return; let vis = true; o.traverseAncestors(a => { if (!a.visible) vis = false; }); if (!vis) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv) { const n = g.attributes.position.count; g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2)); }
    const key = o.material; if (!byMat.has(key)) byMat.set(key, []); byMat.get(key).push(g); });
  const out = new THREE.Group(); out.name = 'yellow-cedar-pavilion-pod';

    if (mat.isMeshBasicMaterial) m2 = new THREE.MeshStandardMaterial({ color: mat.color, emissive: mat.color, emissiveIntensity: .6 });
    if (mat === MAT.poly) m2 = new THREE.MeshStandardMaterial({ color: '#f4efe2', roughness: .4, transparent: true, opacity: .7 });
    const mesh = new THREE.Mesh(merged, m2); mesh.name = mat.name || 'part'; out.add(mesh); }
  const ex = new GLTFExporter();
  const buf = await ex.parseAsync(out, { binary: true });
  let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
};

// ---------- loop ----------
setWallBtn(); setLight(P.get('light') || 'golden'); applyWall(wallT); applyState(); setView(view);
if (step) stepT = NOANIM ? 1 : 0;
const clock = new THREE.Clock(); let frames = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (wallT !== wallGoal) { wallT = NOANIM ? wallGoal : THREE.MathUtils.clamp(wallT + Math.sign(wallGoal - wallT) * dt * .7, 0, 1); applyWall(wallT); }
  let dirty = false;
  if (expT !== expGoal) { const was = expT; expT = NOANIM ? expGoal : THREE.MathUtils.clamp(expT + Math.sign(expGoal - expT) * dt * .55, 0, 1); dirty = true; if (expT === expGoal && view === 'hero') setView('hero'); }
  if (step && stepT < 1) { stepT = NOANIM ? 1 : Math.min(1, stepT + dt * .8); dirty = true; }
  if (dirty) applyState();
  controls.update(); renderer.render(scene, camera);
  if (++frames === 3) { document.getElementById('load').remove(); window.__ready = true; }
});
