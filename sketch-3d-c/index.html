<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<base href="../sketch-3d/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>gill james · sketch 3d-c</title>
<link rel="icon" href="img/favicon-32.png">
<style>
@font-face{font-family:Julius;src:url(fonts/julius-sans-one.woff2) format('woff2');font-display:swap}
@font-face{font-family:Poppins;font-weight:300;src:url(fonts/poppins-300.woff2) format('woff2');font-display:swap}
html,body{margin:0;height:100%;background:#04060c;color:#cfd8e6;overflow:hidden;font-family:Poppins,system-ui,sans-serif;font-weight:300;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#back{position:fixed;left:12px;top:max(10px,env(safe-area-inset-top));z-index:3;color:#cfd8e6;text-decoration:none;font:300 13px/1 Poppins,sans-serif;letter-spacing:.08em;opacity:.75;padding:8px 10px;border:1px solid rgba(207,216,230,.25);border-radius:16px;background:rgba(4,6,12,.4)}
#back:hover{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));text-align:center;font-size:11px;letter-spacing:.12em;opacity:.55;pointer-events:none;transition:opacity 1.2s}
#fb{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
#fb a{color:#cfd8e6;font-family:Julius,sans-serif;letter-spacing:.2em;font-size:18px}
.nogl #fb{display:flex}.nogl #c,.nogl #hint{display:none}
#space{position:fixed;right:12px;top:max(10px,env(safe-area-inset-top));z-index:3;color:#bff5df;font:300 13px/1 Poppins,sans-serif;letter-spacing:.08em;padding:8px 12px;border:1px solid rgba(191,245,223,.4);border-radius:16px;background:rgba(4,6,12,.5);cursor:pointer}
#vw{position:fixed;inset:0;z-index:5;background:rgba(4,6,12,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;touch-action:pinch-zoom}
#vw[hidden],#space[hidden]{display:none}#vw .m img,#vw .m video{max-width:100vw;max-height:80vh;display:block}
#vw .c{font-size:12px;letter-spacing:.1em;opacity:.7;text-align:center;padding:0 16px}
#vw .x{position:absolute;right:10px;top:max(8px,env(safe-area-inset-top));font:300 30px/1 Poppins,sans-serif;color:#cfd8e6;background:none;border:0;padding:8px 12px;cursor:pointer}
#where{position:fixed;left:50%;transform:translateX(-50%);top:max(16px,env(safe-area-inset-top));z-index:3;font:400 12px/1 Julius,sans-serif;letter-spacing:.18em;opacity:.8;pointer-events:none;white-space:nowrap}
#home{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:3;color:#cfd8e6;background:none;border:0;font-size:20px;opacity:.7;padding:8px;cursor:pointer}
</style>
</head><body>
<canvas id="c" aria-label="a 3d sky of gill james's chapters"></canvas>
<a id="back" href="../site-v3/">‹ site</a>
<div id="where">everything</div><button id="home" aria-label="everything">ᑕᐣᓯ</button>
<button id="space" hidden>← space</button>
<div id="vw" hidden><button class="x" aria-label="close">×</button><div class="m"></div><div class="c"></div></div>
<div id="hint">tap a constellation to land · pinch out to step back<br>double-tap sky or ᑕᐣᓯ for everything</div>
<div id="fb"><a href="../site-v3/">gill james</a><span style="font-size:12px;opacity:.6">‹ site-v3</span></div>
<script>
(function(){try{var c=document.createElement('canvas');if(!(c.getContext('webgl2')||c.getContext('webgl')))throw 0}catch(e){document.documentElement.className='nogl'}})();
</script>
<script>if(document.documentElement.className!=="nogl"){var s=document.createElement("script");s.type="module";s.src="../sketch-3d-c/main-c.js";document.body.appendChild(s)}</script>
</body></html>
