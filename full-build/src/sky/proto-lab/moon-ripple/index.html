<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b12">
<title>Moon-water ripple · proto lab</title>
<link rel="stylesheet" href="../_shared/css/lab.css">
<style>
  .stage{background:#070b12;touch-action:none;cursor:crosshair}
  .water, .water video, .water img, #fx{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .water video{opacity:.85}
  .moon{position:absolute;right:12%;top:12%;width:min(18vw,140px);aspect-ratio:1;pointer-events:none;
    background:radial-gradient(circle at 32% 44%,transparent 0 47%,#eef4f8 48%);
    -webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);
    mask:radial-gradient(circle,#000 69%,transparent 70%);
    filter:drop-shadow(0 0 10px rgba(220,230,240,.45));
    opacity:.85}
  #mark{position:absolute;left:50%;top:46%;width:min(48vw,360px);height:auto;
    transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;
    opacity:.88;filter:drop-shadow(0 0 16px rgba(200,220,240,.4))}
  body[data-v="B"] #mark{mix-blend-mode:screen;opacity:.92}
  .chrome{position:absolute;top:calc(58px + var(--safe-t));left:16px;z-index:2;pointer-events:none}
</style>
</head>
<body class="lab">
<header class="labbar">
  <a class="back" href="../">‹ lab</a>
  <div class="who">Moon-water ripple</div>
  <nav class="variants" aria-label="proposals">
    <button type="button" data-v="A" aria-pressed="true">A</button>
    <button type="button" data-v="B">B</button>
    <button type="button" data-v="C">C</button>
  </nav>
</header>
<div class="stage" id="stage">
  <div class="water">
    <img src="../_shared/media/water-poster.jpg" alt="">
    <video autoplay muted loop playsinline poster="../_shared/media/water-poster.jpg" src="../_shared/media/water-loop.webm"></video>
  </div>
  <div class="moon" aria-hidden="true"></div>
  <img id="mark" src="../_shared/media/cv-mark.png" alt="">
  <canvas id="fx"></canvas>
  <div class="chrome"><img class="mark" src="../_shared/media/cv-mark.png" alt=""></div>
</div>
<p class="vnote" id="vnote"></p>
<script src="../_shared/js/lab.js"></script>
<script src="app.js"></script>
<link rel="stylesheet" href="../../../../chrome.css"><script src="../../../../chrome.js" data-hub="../../../../index.html" data-rooms="../../../../rooms.json"></script></body>
</html>
