<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b12">
<title>Spaces walkthrough · proto lab</title>
<link rel="stylesheet" href="../_shared/css/lab.css">
<style>
  .stage{background:#070b12;touch-action:none}
  #sky, #world{position:absolute;inset:0;width:100%;height:100%}
  .garden{position:absolute;inset:0;background:#070b12 center/cover no-repeat;
    -webkit-mask-image:radial-gradient(ellipse at 50% 58%,#000 36%,transparent 72%);
    mask-image:radial-gradient(ellipse at 50% 58%,#000 36%,transparent 72%);
    opacity:.9}
  .chrome{position:absolute;top:calc(56px + var(--safe-t));left:16px;z-index:3;display:flex;align-items:center;gap:12px;pointer-events:none}
  .chrome span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#d0d6de}
  .panel{position:absolute;left:16px;right:16px;bottom:calc(72px + var(--safe-b));z-index:3;
    max-width:420px;padding:16px 18px;border-radius:16px;border:1px solid rgba(200,190,230,.25);
    background:rgba(8,12,20,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  @media(min-width:900px){.panel{left:32px;right:auto;width:420px}}
  .panel h2{margin:0 0 6px;font:400 15px/1.3 Poppins,sans-serif;font-weight:400}
  .panel p{margin:0 0 4px;color:#c8c4d8;font-size:12px}
  .panel .cred{color:#9a96aa;font-size:11px}
  body[data-v="C"] .panel{opacity:.95}
</style>
</head>
<body class="lab">
<header class="labbar">
  <a class="back" href="../">‹ lab</a>
  <div class="who">Spaces walkthrough</div>
  <nav class="variants" aria-label="proposals">
    <button type="button" data-v="A" aria-pressed="true">A</button>
    <button type="button" data-v="B">B</button>
    <button type="button" data-v="C">C</button>
  </nav>
</header>
<div class="stage" id="stage">
  <canvas id="sky"></canvas>
  <div class="garden" id="garden"></div>
  <canvas id="world"></canvas>
  <div class="chrome"><img class="mark" src="../_shared/media/cv-mark.png" alt=""><span>Spaces</span></div>
  <aside class="panel" id="panel">
    <h2>Spirit Eye · the forest garden</h2>
    <p>adaptive forest garden installation (underground)</p>
    <p>fibre optics · day–night</p>
    <p class="cred">joshua ngenda &amp; gill james · Trillium Park, Skwácháys</p>
  </aside>
</div>
<p class="vnote" id="vnote"></p>
<script src="../_shared/js/lab.js"></script>
<script src="app.js"></script>
<link rel="stylesheet" href="../../../../chrome.css"><script src="../../../../chrome.js" data-hub="../../../../index.html" data-rooms="../../../../rooms.json"></script></body>
</html>
