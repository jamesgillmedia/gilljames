<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Film · Lens room · ᑕᐣᓯ</title>
<meta name="theme-color" content="#04070b">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/lab.css">
<link rel="stylesheet" href="css/lens.css">
</head>
<body class="env-lens">
<header class="lab-top" id="top">
  <button type="button" class="lab-btn ic" id="back" aria-label="look back through the eyepiece" hidden>‹</button>
  <a class="sig" href="./" lang="cr" aria-label="Film">ᑕᐣᓯ</a>
  <span class="crumb ju"><b>film · </b><span id="where">lens room</span></span>
  <button type="button" class="lab-btn cam-btn" id="binBtn" aria-pressed="false" aria-label="step back to the film bin"><i class="led" aria-hidden="true"></i><span>bin</span></button>
</header>

<main class="room fadein" id="room" aria-label="lens room: tap the screen for the monitor toolbar, swipe to change films, spread your fingers to step out of the eyepiece" tabindex="0">
  <div class="world" id="world">
    <div class="key-light" id="keyLight" aria-hidden="true"></div>
    <div class="room-grain" aria-hidden="true"></div>
    <div class="volume" id="volume" aria-hidden="true">
      <div class="ceiling"></div>
      <div class="wall back"></div>
      <div class="wall left"></div>
      <div class="wall right"></div>
      <div class="floor">
        <div class="spill-floor" id="spillFloor"></div>
      </div>
      <div class="ribs"></div>
    </div>

    <div class="chamber-glow" id="glow" aria-hidden="true"></div>

    <div class="iris" id="iris" aria-hidden="true"></div>

    <div class="gate-assembly" id="gateAssy">
      <div class="optic" id="optic">
      <div class="eyepiece" id="eyepiece" aria-hidden="true">
        <div class="eye-shadow"></div>
        <div class="eye-body"></div>
        <div class="eye-housing"></div>
        <div class="eye-cup">
          <i class="cup-ring r1"></i>
          <i class="cup-ring r2"></i>
          <i class="cup-ring r3"></i>
        </div>
        <div class="eye-well"></div>
        <div class="aperture-glow"></div>
        <div class="aperture-rim"></div>
        <div class="coat" id="coat"></div>
        <div class="eye-vignette"></div>
        <div class="light-sliver" aria-hidden="true"></div>
      </div>
      <div class="field-stop" aria-hidden="true"></div>
      <div class="bloom" id="bloom" aria-hidden="true"></div>
      <div class="rail left" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="rail right" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="evf" id="evf">
        <div class="gate" id="gate">
          <div class="stock" id="stock">
            <img id="still" alt="" width="720" height="405">
            <video id="vid" playsinline webkit-playsinline preload="none"></video>
            <div class="smear" id="smear"></div>
          </div>
          <canvas class="red-fx" id="falseCv" hidden aria-hidden="true"></canvas>
          <canvas class="red-fx" id="peakCv" hidden aria-hidden="true"></canvas>
          <canvas class="red-fx" id="zebraCv" hidden aria-hidden="true"></canvas>
          <div class="red-guides" id="guides" hidden aria-hidden="true">
            <div class="guide-wide"></div>
            <div class="guide-safe action"></div>
            <div class="guide-safe title"></div>
          </div>
          <canvas class="red-scope" id="scopeCv" hidden aria-hidden="true"></canvas>
          <div class="red-credits" id="redCredits" hidden></div>
          <div class="glass" aria-hidden="true"></div>
          <div class="vignette" aria-hidden="true"></div>
          <div class="grain" aria-hidden="true"></div>
          <div class="shutter" id="shutter" aria-hidden="true">
            <div class="blade top"></div>
            <div class="blade bot"></div>
          </div>
        </div>
        <div class="red-bar" id="redBar" hidden>
          <button type="button" class="cam-btn" data-tool="peak" aria-pressed="false" aria-label="focus peaking"><i class="led" aria-hidden="true"></i><span>peak</span></button>
          <button type="button" class="cam-btn" data-tool="falsec" aria-pressed="false" aria-label="false colour"><i class="led" aria-hidden="true"></i><span>false</span></button>
          <button type="button" class="cam-btn" data-tool="wave" aria-pressed="false" aria-label="luma waveform"><i class="led" aria-hidden="true"></i><span>wave</span></button>
          <button type="button" class="cam-btn" data-tool="guides" aria-pressed="false" aria-label="frame guides"><i class="led" aria-hidden="true"></i><span>guides</span></button>
          <button type="button" class="cam-btn" data-tool="zebras" aria-pressed="false" aria-label="zebras"><i class="led" aria-hidden="true"></i><span>zebras</span></button>
          <button type="button" class="cam-btn" data-tool="credits" aria-pressed="false" aria-label="credits"><i class="led" aria-hidden="true"></i><span>credits</span></button>
          <button type="button" class="cam-btn" id="playBtn" aria-pressed="false" aria-label="play or pause"><i class="led" aria-hidden="true"></i><span>play</span></button>
        </div>
      </div>
      </div>
      <div class="edge-code" id="edge" aria-live="polite"></div>
    </div>

    <section class="bin" id="bin" aria-label="film bin on the monitor: every film, in the list order. Tap a clip or pinch in to look back through the eyepiece." hidden>
      <div class="bin-spill" aria-hidden="true"></div>
      <div class="bin-monitor">
        <div class="bin-bezel">
          <div class="bin-bar"><span>films</span></div>
          <div class="rows" id="rows"></div>
        </div>
      </div>
    </section>
  </div>

  <aside class="console debug-bar" id="console" aria-label="debug strip">
    <span class="debug-tag ju">debug</span>
    <span class="debug-rule" aria-hidden="true"></span>
    <button type="button" class="cam-btn" id="weaveBtn" aria-pressed="false" aria-label="gate weave"><i class="led" aria-hidden="true"></i><span>weave</span></button>
    <div class="debug-red" id="debugRed">
      <button type="button" class="cam-btn" data-tool="peak" aria-pressed="false" aria-label="focus peaking"><i class="led" aria-hidden="true"></i><span>peak</span></button>
      <button type="button" class="cam-btn" data-tool="falsec" aria-pressed="false" aria-label="false colour"><i class="led" aria-hidden="true"></i><span>false</span></button>
      <button type="button" class="cam-btn" data-tool="wave" aria-pressed="false" aria-label="luma waveform"><i class="led" aria-hidden="true"></i><span>wave</span></button>
      <button type="button" class="cam-btn" data-tool="guides" aria-pressed="false" aria-label="frame guides"><i class="led" aria-hidden="true"></i><span>guides</span></button>
      <button type="button" class="cam-btn" data-tool="zebras" aria-pressed="false" aria-label="zebras"><i class="led" aria-hidden="true"></i><span>zebras</span></button>
      <button type="button" class="cam-btn" data-tool="credits" aria-pressed="false" aria-label="credits"><i class="led" aria-hidden="true"></i><span>credits</span></button>
    </div>
  </aside>
</main>

<script src="js/films.js"></script>
<script src="js/app.js"></script>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <clipPath id="evf-shape" clipPathUnits="objectBoundingBox">
      <path d="M0.080 0.018 C0.28 0 0.72 0 0.920 0.018 C0.968 0.022 0.982 0.048 0.982 0.095 C1 0.34 1 0.66 0.982 0.905 C0.982 0.952 0.968 0.978 0.920 0.982 C0.72 1 0.28 1 0.080 0.982 C0.032 0.978 0.018 0.952 0.018 0.905 C0 0.66 0 0.34 0.018 0.095 C0.018 0.048 0.032 0.022 0.080 0.018 Z"/>
    </clipPath>
  </defs>
</svg>

<link rel="stylesheet" href="../../../../chrome.css"><script src="../../../../chrome.js" data-hub="../../../../index.html" data-rooms="../../../../rooms.json"></script></body>
</html>
