<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27/%3E">
<title>opener · sketch · snow-water</title>
<meta name="theme-color" content="#04070b">
<style>
@font-face{font-family:Poppins;font-weight:300;font-display:swap;src:url(media/pro2/fonts/poppins-300.woff2) format("woff2")}
@font-face{font-family:"Julius Sans One";font-display:swap;src:url(media/pro2/fonts/julius-sans-one.woff2) format("woff2")}
@font-face{font-family:Syl;font-weight:700;font-display:block;src:url(media/pro2/fonts/noto-canadian-aboriginal-subset.woff2) format("woff2");unicode-range:U+1400-167F}
:root{--icon-k:1;--tx:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#04070b;color:#e9eef5;font:300 calc(13px*var(--tx))/1.4 Poppins,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;cursor:grab;
 background:radial-gradient(120% 80% at 50% 42%,#121c2e 0%,#070d18 52%,#04070b 100%)}
#stage.down{cursor:grabbing}
.water{position:absolute;inset:0;background:#061018 center/cover no-repeat;background-image:url(media/v2/img/hero/water-1600.webp);opacity:.6;pointer-events:none;will-change:transform,opacity;overflow:hidden}
/* J moon: exact v2 Moonwater CSS crescent (gilljames-v2/css/home.css .moon). Glow held back. Lives in the water layer so it float-ups with the scene. */
.jmoon{position:absolute;left:80%;top:13%;width:20vmin;height:20vmin;max-width:120px;max-height:120px;transform:translate(-50%,-50%);border-radius:50%;z-index:2;pointer-events:none;
  background:radial-gradient(circle at 32% 44%,transparent 0 47%,#eef4f8 48%);-webkit-mask:radial-gradient(circle,#000 69%,transparent 70%);mask:radial-gradient(circle,#000 69%,transparent 70%);
  filter:drop-shadow(2px 2px 0 rgba(10,189,240,.32)) drop-shadow(-2px -2px 0 rgba(254,1,1,.28)) drop-shadow(0 0 10px rgba(170,210,230,.2))}
.jmoon-streak{position:absolute;left:80%;top:20%;width:7vmin;max-width:42px;height:46%;transform:translateX(-50%);z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(210,224,232,0) 0%,rgba(210,224,232,.14) 8%,rgba(210,224,232,.06) 30%,rgba(210,224,232,.025) 62%,transparent 100%);
  filter:blur(7px);mix-blend-mode:screen;opacity:.5;animation:moonStreak 14s ease-in-out infinite;transform-origin:50% 0}
@keyframes moonStreak{0%,100%{opacity:.38;transform:translateX(-50%) scaleY(1)}50%{opacity:.56;transform:translateX(-47%) scaleY(1.03)}}
/* hide the GJDBG corner tab always. ?debug=1 (html.debug) may still open the sheet silently — no tab. */
#dbg .tab{display:none!important;pointer-events:none!important;opacity:0!important;width:0!important;height:0!important;overflow:hidden}
html:not(.debug) #dbg{display:none!important;pointer-events:none!important}

/* native ambience: photo-lab safelight-family pill + room-light dimmer, winter palette, corner card */
.ambui{position:fixed;z-index:8;left:max(10px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;max-width:min(320px,calc(100vw - 20px))}
.ambui>*{pointer-events:auto}
.amb-toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 14px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(10,16,24,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#eef3f5;font:300 11px/1 "Julius Sans One",Poppins,system-ui,sans-serif;letter-spacing:.16em;text-transform:lowercase;cursor:pointer;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.28)}
.amb-toggle:hover{border-color:rgba(255,255,255,.28)}
.ambui.open .amb-toggle{border-color:rgba(255,233,207,.45);color:#ffe9cf}
.amb-glyph{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 32% 32%,#ffe9cf 0 42%,#cfe0f2 58%,transparent 72%);box-shadow:0 0 8px rgba(255,233,207,.5);flex:none}
.amb-tray{width:min(280px,calc(100vw - 24px));padding:8px 14px 10px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(10,16,24,.48);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 40px rgba(0,0,0,.4)}
.amb-tray[hidden]{display:none!important}
.amb-row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px 10px;min-height:44px}
.amb-lab{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.amb-lab label{font:300 10.5px/1 "Julius Sans One",Poppins,system-ui,sans-serif;letter-spacing:.14em;text-transform:lowercase;color:#c9d3d6;white-space:nowrap}
.amb-val{font:300 10px/1 Poppins,system-ui,sans-serif;letter-spacing:.06em;color:#ffe9cf;text-align:right;font-variant-numeric:tabular-nums}
.amb-row input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;padding:0;background:transparent;cursor:pointer;touch-action:none}
.amb-row input[type=range]::-webkit-slider-runnable-track{height:2px;border:0;border-radius:1px;background:rgba(255,255,255,.18)}
.amb-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-6px;border:0;border-radius:50%;background:#ffe9cf;box-shadow:0 0 8px 2px rgba(255,233,207,.5)}
.amb-row input[type=range]::-moz-range-track{height:2px;border:0;border-radius:1px;background:rgba(255,255,255,.18)}
.amb-row input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#ffe9cf;box-shadow:0 0 8px 2px rgba(255,233,207,.5)}
.amb-reset{display:block;width:100%;margin-top:2px;min-height:36px;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:transparent;color:#cfe0f2;font:300 10.5px/1 "Julius Sans One",Poppins,system-ui,sans-serif;letter-spacing:.16em;text-transform:lowercase;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.amb-reset:hover,.amb-reset:active{background:rgba(255,233,207,.08);color:#ffe9cf}
@media (orientation:portrait) and (max-width:620px){
  .ambui{max-width:min(292px,calc(100vw - 20px))}
  #foot{padding-left:max(14px,132px)}
}
@media (orientation:landscape) and (max-height:500px){
  .ambui{left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));max-width:none;width:auto;flex-direction:row;align-items:flex-end;gap:8px}
  .amb-tray{width:auto;flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:center;gap:4px 10px;padding:6px 12px;border-radius:20px}
  .amb-row{display:flex;flex-direction:column;align-items:stretch;min-height:0;gap:0}
  .amb-lab{width:100%;padding:0 2px}
  .amb-lab label{font-size:9.5px}
  .amb-row input[type=range]{height:32px}
  .amb-row input[type=range]::-webkit-slider-thumb{margin-top:-6px}
  .amb-reset{width:auto;min-width:52px;margin:0;min-height:44px;padding:0 12px}
}

.water::after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 30%,transparent 0%,rgba(4,7,11,.25) 50%,rgba(4,7,11,.82) 100%)}
.water .rip{position:absolute;width:18px;height:18px;margin:-9px;border:1px solid rgba(255,255,255,.55);border-radius:50%;animation:rip 1.5s ease-out forwards;pointer-events:none;z-index:4}
.water .rip.soft{border-color:rgba(255,255,255,.3);animation-duration:1.8s}
.water .rip.tight{width:10px;height:10px;margin:-5px;border-color:rgba(255,255,255,.45);animation:rip2 1.2s ease-out forwards}
@keyframes rip{to{transform:scale(16);opacity:0}}
@keyframes rip2{to{transform:scale(9);opacity:0}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;align-items:center;gap:8px;z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
#hud .sig{font-family:Syl,"Noto Sans Canadian Aboriginal",sans-serif;font-weight:700;font-size:calc(16px*var(--icon-k));color:#fff;text-decoration:none;padding:6px 6px;line-height:1}
#hud button{font:inherit;font-size:calc(13px*var(--tx));color:#e9eef5;background:rgba(10,16,24,.62);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer}
#hud button[hidden]{display:none}
#foot{position:fixed;left:0;right:0;bottom:0;padding:0 14px max(14px,env(safe-area-inset-bottom));text-align:center;color:#9fb0c4;font-size:calc(12px*var(--tx));z-index:3;pointer-events:none;text-shadow:0 1px 8px #000;transition:opacity .6s ease-out}
#foot.gone{opacity:0}
/*DBG:CSS:BEGIN*/
#dbg{position:fixed;z-index:60;left:0;top:0;width:0;height:0;pointer-events:none;font:300 11px/1.35 Poppins,system-ui,sans-serif;color:#dfe8f2}
#dbg .tab{position:fixed;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:30px;height:30px;border-radius:50%;pointer-events:auto;cursor:pointer;padding:0;
 border:1px solid rgba(255,255,255,.28);background:rgba(10,16,24,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#cfe0f2;
 font:400 10px/28px "Julius Sans One",Poppins,sans-serif;text-align:center;letter-spacing:0;transition:opacity .25s ease-out,width .25s ease-out,height .25s ease-out}
#dbg:not(.on) .tab{width:16px;height:16px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));opacity:.32;border-color:rgba(255,255,255,.4)}
#dbg:not(.on) .tab span{display:none}
#dbg:not(.on) .tab::before{content:"";position:absolute;inset:-14px}
#dbg:not(.on) .tab::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#ffe9cf}
#dbg.open .tab{opacity:0;pointer-events:none}
#dbg .sheet{position:fixed;display:none;pointer-events:none;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
 background:rgba(10,16,24,.26);-webkit-backdrop-filter:blur(5px) saturate(1.1);backdrop-filter:blur(5px) saturate(1.1);
 border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px 12px;
 left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-height:42vh;
 transform:translateY(calc(100% + 24px));opacity:0;transition:transform .25s ease-out,opacity .25s ease-out,background .25s ease-out}
#dbg.on .sheet{display:block}
#dbg.open .sheet{transform:none;opacity:1;pointer-events:auto}
@media (orientation:landscape) and (min-width:560px){
 #dbg .sheet{left:auto;right:max(8px,env(safe-area-inset-right));width:min(340px,42vw);max-height:68vh;transform:translateX(calc(100% + 24px))}
 #dbg.open .sheet{transform:none}
}
#dbg .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:400 10px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.16em;text-transform:lowercase;color:#9fb0c4}
#dbg .hd b{font-weight:400;margin-right:auto}
#dbg .hd a,#dbg .hd button{font:inherit;color:#cfe0f2;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 9px;text-decoration:none;cursor:pointer;letter-spacing:.08em}
#dbg .rowc,#dbg .info,#dbg .sec,#dbg .hd,#dbg .list{transition:opacity .25s ease-out}
#dbg.drag .sheet{background:rgba(10,16,24,.12)}
#dbg.drag .rowc:not(.act),#dbg.drag .info,#dbg.drag .sec,#dbg.drag .hd,#dbg.drag .list{opacity:.15}
#dbg .sec{margin:8px 0 3px;font:400 9px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.18em;color:#6f8399;text-transform:lowercase}
#dbg .info{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:10px;color:#b9c8d8}
@media (orientation:portrait){#dbg .info{grid-template-columns:auto 1fr auto 1fr}}
#dbg .info span:nth-child(odd){color:#6f8399}
#dbg .info span:nth-child(even){font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#dbg .rowc{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:8px;padding:3px 0;position:relative}
#dbg .rowc label{font-size:10px;color:#9fb0c4;white-space:nowrap}
#dbg .rowc label small{color:#6f8399}
#dbg .rowc .nb{font:300 10px/1 Poppins,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#e9eef5;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:4px 5px;width:100%;text-align:right;min-width:0}
#dbg .rowc .nb:focus{outline:none;border-color:rgba(255,226,190,.7)}
#dbg input[type=number]::-webkit-inner-spin-button{display:none}
#dbg input[type=number]{-moz-appearance:textfield}
#dbg input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;touch-action:none}
#dbg .det input[type=range]{background:linear-gradient(rgba(207,224,242,.55),rgba(207,224,242,.55)) 50% 50%/1px 9px no-repeat}
#dbg input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(207,224,242,.38)}
#dbg input[type=range]::-moz-range-track{height:1px;background:rgba(207,224,242,.38)}
#dbg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;margin-top:-5.5px;background:#ffe9cf;box-shadow:0 0 9px 2px rgba(255,226,190,.55)}
#dbg input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#ffe9cf;box-shadow:0 0 9px 2px rgba(255,226,190,.55)}
#dbg input[type=range]:focus{outline:none}
#dbg input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 10px 3px rgba(255,226,190,.7)}
#dbg .dial{grid-column:1 / -1;display:flex;justify-content:flex-end;gap:6px;height:0;opacity:0;overflow:hidden;transition:height .22s ease-out,opacity .22s ease-out,margin .22s ease-out;margin:0}
#dbg .rowc.dialon .dial{height:28px;opacity:1;margin:2px 0 2px}
#dbg .dial button{font:300 10px/1 Poppins,system-ui,sans-serif;color:#dfe8f2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:7px;min-width:42px;height:26px;cursor:pointer;font-variant-numeric:tabular-nums}
#dbg .seg{grid-column:2 / 4;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
#dbg .seg button{height:30px;padding:0 9px;white-space:nowrap;border:0;background:transparent;color:#9fb0c4;font:400 10px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.14em;cursor:pointer}
#dbg .seg button[aria-pressed=true]{color:#55DAA1}
#dbg .seg i{font-style:normal;color:#5d6f84;font-size:10px}
#dbg .list{font-size:10px;color:#9fb0c4;max-height:96px;overflow:auto}
#dbg .list div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gjview{position:fixed;inset:0;overflow:hidden}
#gjfog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;mix-blend-mode:screen;display:none}
#gjinv{position:absolute;inset:0;pointer-events:none;z-index:20;mix-blend-mode:difference;background:#000;display:none;transition:background-color .2s ease-out}
#gjgrain{position:fixed;left:0;top:0;width:calc(100vw + 256px);height:calc(100vh + 256px);pointer-events:none;z-index:50;display:none;mix-blend-mode:overlay;background-repeat:repeat;background-size:128px 128px;will-change:transform}
/*DBG:CSS:END*/
</style>
<link rel="stylesheet" href="../../_tn/back.css"><script src="../../_tn/back.js" data-tn-root="../../" defer></script></head>
<body>
<div id="gjview">
<div id="stage" aria-label="Opening sketch: pinch in, or tap, to go through the sky">
<div class="water" id="water" aria-hidden="true">
<span class="jmoon" id="jmoon" aria-hidden="true"></span>
<span class="jmoon-streak" id="jmoonStreak" aria-hidden="true"></span>
</div>
<canvas id="cv" aria-hidden="true"></canvas>
<p class="sr" id="srline"></p>
</div>
<header id="hud">
<button type="button" id="back" hidden aria-label="back one stage">&#8249;</button>
<a class="sig" href="./" lang="cr" aria-label="home">ᑕᐣᓯ</a>
</header>
<p id="foot"><b id="hint">pinch in, or tap</b></p>
<aside id="ambui" class="ambui">
  <button type="button" id="ambToggle" class="amb-toggle" aria-expanded="false" aria-controls="ambTray" aria-label="Ambience">
    <span class="amb-glyph" aria-hidden="true"></span>
    <span>ambience</span>
  </button>
  <div id="ambTray" class="amb-tray" hidden>
    <div class="amb-row" data-id="sn">
      <div class="amb-lab"><label for="amb_sn">snow</label><span class="amb-val">100</span></div>
      <input type="range" id="amb_sn" min="0" max="200" step="0.1" value="100" aria-label="snow amount">
    </div>
    <div class="amb-row" data-id="hz">
      <div class="amb-lab"><label for="amb_hz">mist</label><span class="amb-val">20</span></div>
      <input type="range" id="amb_hz" min="0" max="100" step="0.1" value="20" aria-label="mist and haze">
    </div>
    <div class="amb-row" data-id="rf">
      <div class="amb-lab"><label for="amb_rf">reflection</label><span class="amb-val">100</span></div>
      <input type="range" id="amb_rf" min="0" max="200" step="0.1" value="100" aria-label="reflection strength">
    </div>
    <div class="amb-row" data-id="mg">
      <div class="amb-lab"><label for="amb_mg">moon</label><span class="amb-val">100</span></div>
      <input type="range" id="amb_mg" min="0" max="200" step="0.1" value="100" aria-label="moon glow">
    </div>
    <button type="button" id="ambReset" class="amb-reset">reset</button>
  </div>
</aside>
</div>
<script>
/*DBG:JS:BEGIN*/
window.GJDBG=(function(){
var Q=new URLSearchParams(location.search);
var on=Q.get('debug')==='1',cfg=null,root=null,sheet=null,infoEl=null,listEl=null,ctl={},vals={};
var open=false,idleT=0,dragN=0,fps=60,ft=16.7,lastT=0,uiT=0,grainOn=false,grainEl=null;
var LOOK=[
  {id:'br',label:'brightness',min:-100,max:100,step:.1,def:0,param:'br',detent:1.2,group:'look'},
  {id:'ct',label:'contrast',min:-100,max:100,step:.1,def:0,param:'ct',detent:1.2,group:'look'},
  {id:'gr',label:'grain',min:0,max:100,step:.1,def:0,param:'gr',group:'look'},
  {id:'inv',label:'invert',min:0,max:100,step:.1,def:0,param:'inv',group:'look'},
  {id:'sf',label:'star flash',min:0,max:100,step:.1,def:0,param:'sf',group:'look'},
  {id:'af',label:'ambient flash',min:0,max:100,step:.1,def:0,param:'af',group:'look'},
  {id:'bpm',label:'test beat',unit:'bpm',min:60,max:180,step:.1,def:100,param:'bpm',group:'flash beat'},
  {id:'sync',label:'sync',min:0,max:100,step:.1,def:0,param:'sync',group:'flash beat',ls:'gj.sync'}
];
var LOOKIDS={br:1,ct:1,gr:1,inv:1,sf:1,af:1,bpm:1,sync:1};
function isLook(k){return !!LOOKIDS[k.id]}
var beatAcc=0,beatSrc=null,fogEl=null,fogG=null,invEl=null,fogLevel=1,fogT=0,fogBlobs=null;
function dec(step){var s=String(step),i=s.indexOf('.');return i<0?0:s.length-i-1}
function r(v,step){return +(+v).toFixed(Math.max(dec(step),0))}
function setP(k,v,def){
  var u=new URL(location.href);
  if(v===null||v===undefined||(def!==undefined&&String(v)===String(def)))u.searchParams.delete(k);else u.searchParams.set(k,String(v));
  try{history.replaceState(history.state,'',u.pathname+u.search+u.hash)}catch(e){}
}
function getNum(k,def){var v=Q.get(k);if(v===null||v==='')return def;v=parseFloat(v);return isFinite(v)?v:def}
function applyLook(){
  var view=document.getElementById('gjview');
  var br=vals.br||0,ct=vals.ct||0,iv=(vals.inv||0)/100;
  /* invert is a grey difference layer: |c - v| is the image at 0, a strong invert at 1 (capped at 0.8 and eased with sin so the top is gentle, not pure white) and a solarised, still-coloured graphic between; a hue sweep that returns to 0 at both ends adds the colour shift */
  var hue=iv>0?Math.sin(iv*Math.PI)*140:0;
  if(view){
    view.style.filter=(br||ct||iv)?'brightness('+(1+br/100*.8).toFixed(4)+') contrast('+(1+ct/100*.7).toFixed(4)+')'+(iv?' hue-rotate('+hue.toFixed(2)+'deg)':''):'';
  }
  if(invEl){
    var gv=Math.round(Math.sin(iv*Math.PI/2)*.8*255);
    invEl.style.display=iv>0?'block':'none';
    invEl.style.backgroundColor='rgb('+gv+','+gv+','+gv+')';
  }
  var gr=vals.gr||0;
  grainOn=gr>0;
  if(grainEl){

    for(var j=1;j<=n;j++){var f=j/(n+1);Pn.push([sg.a[0]+(sg.b[0]-sg.a[0])*f,sg.a[1]+(sg.b[1]-sg.a[1])*f])}});

function markScreen(p){var sc=Math.min(W,H)*(PORT?.52:.46)/250;return [W*.5+p[0]*sc,H*.30+p[1]*sc]}

  var fs=Math.min(100*(W*.8)/widest,PORT?46:54)*tx;

  var lh=fs*1.38,y0=H*.5-(lines.length-1)*lh/2;

function build(){

    while(pts.length<c.n&&tries<4000){

      dl:(r()-.5)*.08,sw:(r()-.5)*2,ox:0,oy:0,vx:0,vy:0,px:A[0],py:A[1],z:node?1:.2+r()*.8});

/* ---------- frame ---------- */
var lastT=0,wScale=1,waterFloatY=0;

function snowIn(){return smoother(clamp((arriveMs-SNOW_DELAY)/SNOW_RAMP,0,1))}

function draw(t,dt,now){

function drawRefl(x,y,p,layerAl,useTint){

      g.beginPath();g.moveTo(p._lx,p._ly);g.lineTo(x,y);g.stroke();
    }
    if(p.node){
      var gs=(5+16*p.b)*(1+.07*Math.sin(t/900+(x+y)*.01))*(1+1.5*sfl);
      var tint=p.chap>=0?CHAP[p.chap].glow:GW;
      g.globalAlpha=Math.min(1,al*(1+.6*sfl))*(.45+.5*p.b)*(1-conB);g.drawImage(GW,x-gs,y-gs,gs*2,gs*2);
      g.globalAlpha=Math.min(1,al*(1+.6*sfl))*(.45+.5*p.b)*conB;g.drawImage(tint,x-gs,y-gs,gs*2,gs*2);
      g.globalAlpha=Math.min(1,al);g.fillStyle='#fff';g.beginPath();g.arc(x,y,Math.max(1.1,1+p.b*1.6),0,7);g.fill();
    }else{
      g.globalAlpha=Math.min(1,al);
      if(p.rr>1.25||sfl>.02){var g2=p.rr*7*(1+2*sfl);g.globalAlpha=Math.min(1,al*(1+.8*sfl));g.drawImage(GW,x-g2,y-g2,g2*2,g2*2)}

    g.globalAlpha=1;g.lineWidth=1;g.strokeStyle='rgba(200,220,240,'+mkA.toFixed(3)+')';g.beginPath();
    STROKES.forEach(function(s){s.forEach(function(q,j){var x=mox+q[0]*msc,y=moy+q[1]*msc;if(j)g.lineTo(x,y);else g.moveTo(x,y)});g.stroke();g.beginPath()});

      var E=EDGES[e],a1=PTS[E[0]],b1=PTS[E[1]];

    for(var c=0;c<CLU.length;c++){g.fillStyle='rgba('+CLU[c].tint+',1)';g.fillText(CLU[c].k,CLU[c].x,CLU[c].y)}

  if(SNOW){
    var spK=(1-.5*pinchAct)*(1+.35*touchAct),R=Math.min(W,H)*.34;
    g.fillStyle='#e9f1ff';

      var f=FL[i],z=f.z;
      if(!snowReleased(i,FL.length))continue;

      if(Math.abs(zoomK)>.001){var zf=1+zoomK*dt*(1.15+z*1.8);f.x=cx+(f.x-cx)*zf;f.y=cy+(f.y-cy)*zf}

        if(f.x<-40)f.x=W+20;else if(f.x>W+40)f.x=-20;
      }
      var tw=.55+.45*Math.sin(t*.001*(f.tw||1)+f.ph);

      var tgt=PTS[f.tid];

        dys=lerp(f.y,tgt.py,u);

      var a=snowA*hold+(tgt?(.5+.4*(tgt.b||.5))*u*hold:0);
      if(a<.02)continue;
      var rr2=lerp(f.r*(1+.2*touchAct), tgt?Math.max(1.2,1+tgt.b*1.6):1.4, u);
      var defo=lerp(1, .2, u)*(1.4+z*2.2);

        g.globalAlpha=Math.min(.95,a*u);

      }else{
        g.globalAlpha=Math.min(.7,a*.7);
        g.beginPath();g.arc(dxs,dys,Math.max(.8,rr2*.45),0,7);g.fill();
      }
    }
    /* near-lens bokeh stays in the foreground snow layer */
    var wantTouch=touchAct>.1&&now-lastTouchT<2500&&(ptrN>0||touchAct>.3);
    bokAcc+=dt*(wantTouch?(ptrN>0?7:5):0)+dt*(pinchAct>.1?2.2*pinchAct:0);
    if(bokAcc>1){
      bokAcc=0;
      if(pinchAct>.3&&ptrN!==1)spawnBokeh(cx,cy,Math.min(W,H)*.35,0,0,0,.6,2.1);
      else if(wantTouch)spawnBokeh(touchX,touchY,34,0,0,0,1.15,1.7);
    }
    g.save();g.globalCompositeOperation='lighter';
    for(var b=BOK.length-1;b>=0;b--){
      var o=BOK[b];o.t+=dt;var u=o.t/o.life;
      if(u>=1){BOK.splice(b,1);continue}
      o.x+=o.vx*dt;o.y+=o.vy*dt;
      if(Math.abs(zoomK)>.001){var z2=1+zoomK*dt*2.6;o.x=cx+(o.x-cx)*z2;o.y=cy+(o.y-cy)*z2}
      var env=Math.sin(u*3.1416),dm=o.d*(.55+.9*u);
      g.globalAlpha=Math.min(.8,o.a*env*(SNOW?1:0)*(1-merge*.7));
      g.drawImage(BOKS,o.x-dm/2,o.y-dm/2,dm,dm);
    }
    g.restore();g.globalAlpha=1;
  }
  /* m4's tap glow */
  if(tapGlow){
    var age=(now-tapGlow.t)/1100;
    if(age>=1)tapGlow=null;else{
      var a2=(1-age)*(1-age)*.5;
      var rad=g.createRadialGradient(tapGlow.x,tapGlow.y,0,tapGlow.x,tapGlow.y,128);
      rad.addColorStop(0,'rgba(228,221,210,'+a2.toFixed(3)+')');rad.addColorStop(1,'rgba(228,221,210,0)');
      g.globalAlpha=1;g.fillStyle=rad;g.beginPath();g.arc(tapGlow.x,tapGlow.y,128,0,6.3);g.fill();
    }
  }
  g.globalAlpha=1;
}
