<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Preview tour · Gill James</title>
<link rel="stylesheet" href="tour.css">
</head>
<body>
<main class="tour-index">
<h1>Preview tour</h1>
<ol id="stops"></ol>
</main>
<script src="stops.js"></script>
<script>
var list = document.getElementById("stops");
(window.GJ_STOPS || []).forEach(function(s){
  var li = document.createElement("li");
  var a = document.createElement("a");
  a.href = s.href;
  a.textContent = s.n + " · " + s.t;
  li.appendChild(a);
  list.appendChild(li);
});
</script>
<link rel="stylesheet" href="../../../chrome.css"><script src="../../../chrome.js" data-hub="../../../index.html" data-rooms="../../../rooms.json"></script>
</body>
</html>
