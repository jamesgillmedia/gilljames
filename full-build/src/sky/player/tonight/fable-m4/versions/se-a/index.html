<template id="tell-0" data-pdf="1"><h1>spirit eye</h1>
<p class="by">joshua ngenda &amp; gill james</p>
<p class="credit">Spirit Eye of skwácháýs · a public art concept co-created with Joshua Ngenda</p>
<p class="credit">BIDC Public Art Intensive · Spatial Design Future Building 2025 · Vancouver, June 2025</p>
<p class="credit">Best Public Art Concept · Council’s Choice</p></template>
<template id="tell-1" data-pdf="2"><h2>LAND ACKNOWLEDGEMENT</h2>
      <p>the unceded, unsurrendered, and ancestral homelands of the hən̓q̓əmin̓əm̓ and Sḵwxw̱ú7mesh Sníchim speaking people’s of the xʷməθkʷəy̓əm (Musqueam), Sḵwxw̱ú7mesh Úxwumixw (Squamish Nation) and səlilwətaɬ (Tsleil- Waututh) peoples, and the the supernatural tunnels of Sínulhķaý</p></template>
<template id="tell-2" data-pdf="5"><h2>ARTIST STATEMENT</h2>
      <p>Incorporating the Skwxwú7mesh &amp; xʷməθkʷəy̓əm legend of Sínulhķaý / sʔi:ɬqəy̓ the two headed serpent and the supernatural world. After having been blocked by city infrastructure for 100’s of years the spindle whorls reopen the ancestral portals to the underworld and the place where people reside. A supernatural place of healing and creation where the society relearns forgotten techniques and cultural practices ready to reemerge and caretake the world.</p></template>
<template id="tell-3" data-pdf="6"><h2>DESCRIPTION</h2>
      <p>Centering art as infrastructure, the human need for light and nature, a forest garden that both sustains life and materials for creation. A giant lens floating on the ocean surface, reminiscent of a salish spindle whorl, moves with the sun and allows for water to pass over in stormy weather. Projects light underground through a large cluster of fibre optics</p></template>
<template id="tell-5" data-pdf="10"><h2>SITE SIGNIFICANCE</h2>
      <p class="sub">Skwácháýs</p>
      <p class="sub">Place where water is drawn down into a whirlpool</p>
      <p>Trillium Park is located on the northern edge of Skwácháýs. Skwácháýs is a supernatural place of significance with mud pools being portals to the Spirit World with underground tunnels carved by Sínulhķaý / sʔi:ɬqəy̓ Connecting lakes and pools as far as deerlake and up into the interior. Trillium park was an intertidal mudflat. It was an area of mariculture and hunting such as clam gardening and duck hunting.</p></template>
<template id="tell-10" data-pdf="17"><h2>ECOSYSTEM INTERACTIONS</h2>
      <p class="sub">Subterranean Forest Garden Novel Ecosystem</p>
      <p>a forest garden ecosystem that takes elements of how the area existed prior to 1850 while also introducing non native plants that support life and creation.</p>
      <p>layered structure mimicking natural forest structure with large cedar cottonwood and fir trees around the outside, with an understory and inner wetland that maximizes biodiversity with an emphasis on plants that feed that community, support cultural practices and support creation.</p></template>
<template id="tell-14" data-pdf="25"><h2>COMMUNITY VALUE</h2>
      <ul class="cv">
        <li>-Provide light to sustain life and creation</li>
        <li>-Opportunities for artists</li>
        <li>-Educating community</li>
        <li>-Intergenerational caretakers ie descendants of Cease Whyss</li>
        <li>-Place for cultural practice</li>
        <li>-Food sovereignty</li>
        <li>-Relearning traditional techniques and practices</li>
      </ul></template>
