<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>constellation · ᑕᐣᓯ</title>
<link rel="stylesheet" href="blend.css">
</head>
<body>
<canvas id="c" aria-label="Constellation field. Pinch or scroll to zoom into a star, drag to look around."></canvas>
<header id="bar">
  <button id="home" type="button" class="sig" lang="cr" aria-label="the whole sky">ᑕᐣᓯ</button>
  <span id="where" aria-live="polite">field</span>
  <span class="sp"></span>
  <button id="out" type="button" aria-label="zoom out one step">‹ out</button>
  <button id="tilt" type="button" aria-pressed="false" hidden>tilt</button>
</header>
<section id="board" tabindex="-1" hidden role="dialog" aria-modal="true" aria-labelledby="bt">
  <div class="bw"></div>
  <nav class="bn"><button id="bback" type="button">‹ back</button><button id="bcloser" type="button">closer ›</button></nav>
</section>
<p id="hint">pinch or tap a star · drag to look around</p>
<div id="chip" class="chip" hidden></div>
<script src="data.js"></script>
<script src="blend.js"></script>
<link rel="stylesheet" href="../../../../chrome.css"><script src="../../../../chrome.js" data-hub="../../../../index.html" data-rooms="../../../../rooms.json"></script></body>
</html>
