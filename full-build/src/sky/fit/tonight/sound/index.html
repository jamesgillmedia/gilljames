}

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var stage=$('stage'),cv=$('cv'),g=cv.getContext('2d');
var W=0,H=0,DPR=1,PORT=true;
var Q=new URLSearchParams(location.search);

/* Copied from m4 (not imported): the mark strokes, the glow sprite recipe, the chapter tints (data.json). The analyser graph follows sky.js (AN with FD/TD byte arrays, fftSize 512). */
var STROKES=[[[-58.5,-96],[-156.5,-95],[-203.5,-61],[-213.5,1],[-203.5,63],[-156.5,97],[-58.5,97]],[[-26.5,-97],[25.5,-94],[44.5,-51],[25.5,-8],[-26.5,-5]],[[99.5,105],[99.5,20],[149.5,15],[191.5,-11],[211.5,-55],[214.5,-105]]];
var TINT=['150,220,255','170,245,212','255,236,205','255,182,176','214,222,236','190,205,255'];
var NCL=6,NFIELD=130;

function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,u){return a+(b-a)*u}
function seeded(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function glowSprite(rgb){var c=document.createElement('canvas');c.width=c.height=128;var q=c.getContext('2d'),gr=q.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba('+rgb+',.95)');gr.addColorStop(.18,'rgba('+rgb+',.4)');gr.addColorStop(.55,'rgba('+rgb+',.08)');gr.addColorStop(1,'rgba('+rgb+',0)');
  q.fillStyle=gr;q.fillRect(0,0,128,128);return c}
var GW=glowSprite('205,225,255'),GT=TINT.map(glowSprite);
var FOGS=(function(){var c=document.createElement('canvas');c.width=c.height=128;var q=c.getContext('2d'),gr=q.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,.5)');gr.addColorStop(.5,'rgba(255,255,255,.14)');gr.addColorStop(1,'rgba(255,255,255,0)');q.fillStyle=gr;q.fillRect(0,0,128,128);return c})();

/* ---------- audio and analysis ---------- */
var TRK=[],tr=null,lt=null,au=null,AC=null,AN=null,GN=null,FD=null,TD=null,started=false,playing=false,audioErr='';
var SEED=Math.round(parseFloat(Q.get('seed'))||7),SENS=1,FLASHK=.6,VOL=.8;
var BANDS=[[30,600],[600,2500],[2500,9000]],bandName=['bass','mid','high'];
var lvl={bass:0,mid:0,high:0,rms:0},pk={bass:.2,mid:.2,high:.2},CL=[0,0,0,0,0,0],clPk=[.2,.2,.2,.2,.2,.2],kick=0;
var PF=new Float32Array(16),prevFlux=0,avgFlux=0,lastOn=-9,ons=[],B={k0:0,t0:0,Tb:.6,n:0,lock:0},bpmEst=0,bpmSrc='',lastMedia=0,nOn=0;
/* Measured tempos. Used only when a track has no bpm of its own (data.json is the source once that field is there). */
var TEMPO={togo:92.7,gone:89.1,noproblem:84.7,lostintime:81,equals:116.2,ii:62.9};

function binOf(hz){var sr=AC?AC.sampleRate:44100;return clamp(Math.round(hz/(sr/512)),0,255)}
function meanBins(a,b){var s=0,n=0;for(var i=a;i<=b;i++){s+=FD[i];n++}return n?s/n/255:0}
function trackBpm(t){
  if(!t)return null;
  var b=parseFloat(t.bpm);
  if(isFinite(b)&&b>0)return {bpm:b,src:'data'};
  b=TEMPO[t.k];
  if(isFinite(b)&&b>0)return {bpm:b,src:'table'};
  return null;
}
/* The clock follows the song that is actually loaded while one is playing. A first tap only moves the selection. */
function clockTrack(){return (lt&&(playing||lt===tr))?lt:tr}
function fixTempo(){
  var info=trackBpm(clockTrack());
  if(!info)return;
  B.Tb=60/info.bpm;bpmEst=info.bpm;bpmSrc=info.src;
}
function resetAnalysis(){
  prevFlux=0;avgFlux=0;lastOn=-9;PF.fill(0);ons=[];B={k0:0,t0:0,Tb:.6,n:0,lock:0};bpmEst=0;nOn=0;kick=0;
  lvl.bass=lvl.mid=lvl.high=lvl.rms=0;for(var i=0;i<NCL;i++)CL[i]=0;
  fixTempo();
}
function beatFn(){return au&&started?B.k0+(au.currentTime-B.t0)/B.Tb:0}
function estimate(){/* measured bpm owns B.Tb; onsets must not move it */}
function onOnset(t){
  ons.push(t);if(ons.length>64)ons.shift();nOn++;kick=1;
  if(B.n===0){B.t0=t;B.k0=0;B.lock=t}
  else{
    var x=(t-B.t0)/B.Tb,n=Math.round(x),err=(x-n)*B.Tb;
    if(Math.abs(err)<.3*B.Tb){B.t0+=err*.6;B.lock=t}
    else if(t-B.lock>4*B.Tb){B.k0=B.k0+Math.ceil(x);B.t0=t;B.lock=t}
  }
  B.n++;
}
function listen(dt){
  var live=AN&&au&&!au.paused&&!au.ended;
  if(!live){
    var d=Math.exp(-dt*3);lvl.bass*=d;lvl.mid*=d;lvl.high*=d;lvl.rms*=d;kick*=d;for(var i=0;i<NCL;i++)CL[i]*=d;
    return;
  }
  AN.getByteFrequencyData(FD);AN.getByteTimeDomainData(TD);
  var t=au.currentTime;
  if(t<lastMedia-.25){resetAnalysis()}
  lastMedia=t;
  var s=0;for(var i2=0;i2<TD.length;i2++){var v=(TD[i2]-128)/128;s+=v*v}
  lvl.rms=lvl.rms*.6+.4*Math.min(1,Math.sqrt(s/TD.length)*3.2);
  var raw=[meanBins(binOf(BANDS[0][0]),binOf(BANDS[0][1])),meanBins(binOf(BANDS[1][0]),binOf(BANDS[1][1])),meanBins(binOf(BANDS[2][0]),binOf(BANDS[2][1]))];
  var nm=['bass','mid','high'];
  for(var b=0;b<3;b++){
    pk[nm[b]]=Math.max(raw[b],pk[nm[b]]*Math.exp(-dt/20));
    var u=clamp(raw[b]/(pk[nm[b]]+.04)*SENS,0,1.4);u=Math.pow(Math.min(1,u),1.4)*(u>1?u:1);
    var k=u>lvl[nm[b]]?.55:.12;lvl[nm[b]]+=(u-lvl[nm[b]])*(1-Math.pow(1-k,dt*60));
  }
  /* six cluster bands, log-spaced from 600 Hz to 9 kHz (the songs carry little above that) */
  for(var c=0;c<NCL;c++){
    var lo=BANDS[1][0]*Math.pow(BANDS[2][1]/BANDS[1][0],c/NCL),hi=BANDS[1][0]*Math.pow(BANDS[2][1]/BANDS[1][0],(c+1)/NCL);
    var a=binOf(lo),z=Math.max(a,binOf(hi)-1),m=meanBins(a,z);
    clPk[c]=Math.max(m,clPk[c]*Math.exp(-dt/20));
    var uu=Math.pow(clamp(m/(clPk[c]+.04)*SENS,0,1),1.5),kk=uu>CL[c]?.5:.1;
    CL[c]+=(uu-CL[c])*(1-Math.pow(1-kk,dt*60));
  }
  /* kick onsets: positive spectral flux over the low bins (about 0-1.5 kHz, low bins weighted) against its own adaptive average, local peak only, with a refractory period */
  var fx=0;
  for(var q=0;q<16;q++){var dq=FD[q]-PF[q];if(dq>0)fx+=dq*(q<7?1:.5);PF[q]=FD[q]}
  fx=fx/255/4;
  avgFlux+=(fx-avgFlux)*(1-Math.exp(-dt/.6));
  var thr=(avgFlux*1.7+.012)/Math.max(.5,SENS);
  if(fx>thr&&fx>=prevFlux&&t-lastOn>.2){lastOn=t;onOnset(t)}
  prevFlux=fx;
  kick*=Math.exp(-dt*7);
  GJFX.fogLevel(.45+1.1*lvl.rms);
}
function mkAudio(){
  if(au)return true;
  au=document.createElement('audio');au.preload='none';au.crossOrigin='anonymous';au.setAttribute('playsinline','');document.body.appendChild(au);
  au.addEventListener('ended',function(){playing=false;started=false;au.currentTime=0;setPP();resetAnalysis();$('hint').textContent='tap to play again';$('foot').classList.remove('gone')});
  au.addEventListener('error',function(){audioErr='audio failed to load';playing=false;setPP()});
  return true;
}
function graph(){
  if(AN)return;
  try{
    var C=window.AudioContext||window.webkitAudioContext;AC=AC||new C();
    var src=AC.createMediaElementSource(au);AN=AC.createAnalyser();AN.fftSize=512;AN.smoothingTimeConstant=.5;
    GN=AC.createGain();GN.gain.value=VOL;
    src.connect(AN);AN.connect(GN);GN.connect(AC.destination);
    FD=new Uint8Array(AN.frequencyBinCount);TD=new Uint8Array(AN.fftSize);
  }catch(e){audioErr='no web audio'}
}
function setPP(){var pp=$('pp');pp.classList.toggle('on',playing);pp.classList.toggle('quiet',playing)}
function trackOf(k){return TRK.filter(function(x){return x.k===k})[0]||null}
function songLabel(){
  var t=tr?tr.title+' · '+tr.artist:'';
  if(tr&&lt&&lt!==tr&&playing)t+=' · tap again to play';
  $('song').textContent=t;
}
/* Songs follow one rule: the first tap on a song selects it (highlight and title), a second tap on the same song plays it, a tap on another song moves the selection. */
function selectSong(k){
  var t=trackOf(k);if(!t)return;
  tr=t;GJFX.setSeg('song',k);songLabel();
  if(!(playing&&lt&&lt!==tr))fixTempo();
  var info=trackBpm(tr);
  if(info&&GJFX.setBpm)GJFX.setBpm(info.bpm);
  if(!playing){$('hint').textContent='tap again to play';$('foot').classList.remove('gone')}
}
function loadSel(){
  mkAudio();
  au.pause();au.src=tr.file;au.currentTime=0;lt=tr;
  started=false;resetAnalysis();lastMedia=0;
}
function startPlay(){
  mkAudio();if(!tr)return;
  if(lt!==tr)loadSel();
  graph();
  try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}
  started=true;playing=true;setPP();songLabel();
  var pr=au.play();if(pr&&pr.catch)pr.catch(function(){playing=false;audioErr='play was blocked';setPP()});
  $('foot').classList.add('gone');
}
function togglePlay(){
  mkAudio();
  if(playing){au.pause();playing=false;setPP();songLabel();return}
  if(!tr){selectSong(TRK[0]&&(trackOf('lostintime')||TRK[0]).k);if(!tr)return}
  startPlay();
}
function songTap(k){if(tr&&tr.k===k){if(playing&&lt===tr){au.pause();playing=false;setPP();songLabel()}else startPlay()}else selectSong(k)}

/* ---------- sky: restored v3.2/v3.3 Sound waveform constellation (SH.sound from constellations.json / m4 sky.js).
 Field stars stay seeded. Music bands light the figure by x. Invert, pinch, analyser, and the rest of the room are unchanged. */
var CS=[],FS=[],EDG=[],HUB=[],DES=[],rngF=null,Z=1,TZ=1,pcx=0,pcy=0,pinchAct=0;
var SH_SOUND={"t":"255,182,176","s":[[0.058,0.493,0.35,0],[0.143,0.434,0.45,0],[0.195,0.295,0.63,0],[0.186,0.645,0.45,0],[0.282,0.392,0.53,0],[0.338,0.216,0.8,0],[0.347,0.763,0.55,0],[0.441,0.135,0.92,0],[0.442,0.812,0.62,0],[0.498,0.253,0.71,0],[0.567,0.183,0.86,0],[0.57,0.827,0.58,0],[0.659,0.355,0.57,0],[0.718,0.259,0.66,0],[0.719,0.711,0.47,0],[0.807,0.434,0.44,0],[0.886,0.419,0.5,0],[0.941,0.497,0.35,0],[0.26,0.93,0.2,1],[0.61,0.06,0.24,1],[0.9,0.88,0.26,1],[0.15,0.7,0.3,1]],"e":[[2,3],[5,6],[7,8],[10,11],[13,14],[0,1],[1,2],[2,4],[4,5],[5,7],[7,9],[9,10],[10,12],[12,13],[13,15],[15,16],[16,17]]};
function markScreen(){var sc=Math.min(W,H)*(PORT?.4:.26)/430;return {sc:sc,x:W*.5,y:Math.max(58,H*.075)+ (PORT?20:6)}}
function build(){
  PORT=H>=W;
  var r=seeded(SEED*7919+13),u=Math.min(W,H),i,j,k;
  var boxW=u*(PORT?0.88:0.70), boxH=boxW*0.5;
  var ox=(W-boxW)/2, oy=(H-boxH)/2+(PORT?H*0.03:0);
  CS=[];EDG=[];HUB=[];DES=[];
  var groups=[[],[],[],[],[],[]];
  var S=SH_SOUND.s;
  for(i=0;i<S.length;i++){
    var x=ox+S[i][0]*boxW, y=oy+S[i][1]*boxH;
    var band=Math.min(5, Math.max(0, Math.floor(S[i][0]*6)));
    var star={x:x,y:y,b:S[i][2],rr:1+S[i][2]*1.1,ph:r()*6.28,px:x,py:y,stray:S[i][3],band:band,ix:i};
    groups[band].push(star);
  }
  for(i=0;i<NCL;i++){
    var pts=groups[i], mx=ox+boxW*(i+.5)/6, my=oy+boxH/2, R=24;
    if(pts.length){
      mx=0;my=0;pts.forEach(function(s){mx+=s.x;my+=s.y});mx/=pts.length;my/=pts.length;
      pts.forEach(function(s){R=Math.max(R,Math.hypot(s.x-mx,s.y-my)+10)});
    }
    CS.push({s:pts,x:mx,y:my,R:R});
  }
  for(i=0;i<SH_SOUND.e.length;i++){
    var ia=SH_SOUND.e[i][0], ib=SH_SOUND.e[i][1], a=null,b=null,ci=0,cj=0,ai=0,aj=0;
    for(j=0;j<CS.length;j++){
      for(k=0;k<CS[j].s.length;k++){
        if(CS[j].s[k].ix===ia){a=CS[j].s[k];ci=j;ai=k}
        if(CS[j].s[k].ix===ib){b=CS[j].s[k];cj=j;aj=k}
      }
    }
    if(a&&b) DES.push([ci,ai,cj,aj]);
  }
  FS=[];
  for(i=0;i<NFIELD;i++){var z=.2+r()*.8;FS.push({x:r()*W,y:r()*H,z:z,b:.3+r()*.7,rr:.5+r()*1.2,ph:r()*6.28,px:0,py:0})}

function layout(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);build()}

<script>
/* Native inverter bar. Gesture only; value persists; audio is untouched. Same with Reduce Motion. */
(function(){
  var el=document.getElementById('invctl'), inp=document.getElementById('inv'), vis=document.getElementById('vis');
  if(!el||!inp||!vis)return;
  var KEY='gj.sound.invert', hideT=0, last={t:0,x:0}, dbl=false, dragging=false;
  function clamp(v,a,b){return v<a?a:v>b?b:v}
  function load(){try{var v=parseFloat(localStorage.getItem(KEY));return isFinite(v)?clamp(v,0,1):0}catch(e){return 0}}
  function apply(v,save){
    v=clamp(+v,0,1);
    if(!isFinite(v))v=0;
    vis.style.setProperty('--inv', v.toFixed(4));
    var veil=document.getElementById('inveil');
    if(veil){
      var g=Math.round(v*255);
      veil.style.backgroundColor='rgb('+g+','+g+','+g+')';
      veil.style.display=v>0.001?'block':'none';
    }
    el.style.setProperty('--p', (v*100).toFixed(1)+'%');
    inp.style.setProperty('--p', (v*100).toFixed(1)+'%');
    if(document.activeElement!==inp || String(inp.value)!==String(v)) inp.value=String(v);
    inp.setAttribute('aria-valuenow', v.toFixed(2));
    inp.setAttribute('aria-valuetext', Math.round(v*100)+'% inverted');
    el.classList.toggle('lit', v>0.001);
    if(save){try{localStorage.setItem(KEY,String(v))}catch(e){}}
  }
  function open(){clearTimeout(hideT);el.classList.add('open')}
  function maybeClose(){clearTimeout(hideT);hideT=setTimeout(function(){if(document.activeElement===inp||dragging)return;el.classList.remove('open')},1400)}
  apply(load(), false);
  el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')open()});
  el.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')maybeClose()});
  el.addEventListener('focusin',open);
  el.addEventListener('focusout',maybeClose);
  inp.addEventListener('input',function(){apply(inp.value,true)});
  inp.addEventListener('pointerdown',function(e){
    var t=performance.now();
    if(t-last.t<500&&Math.abs(e.clientX-last.x)<48){dbl=true;last.t=0}else{dbl=false;last={t:t,x:e.clientX}}
    dragging=true;open();
  });
  inp.addEventListener('dblclick',function(e){e.preventDefault();apply(0,true)});
  function release(){
    if(!dragging)return;
    dragging=false;
    if(dbl){dbl=false;apply(0,true)}
    maybeClose();
  }
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  /* double-tap or double-click the label also resets */
  var lt=0;
  el.querySelector('.inv-lab').addEventListener('click',function(e){
    e.preventDefault();
    var n=performance.now();
    if(n-lt<500)apply(0,true);
    lt=n;
  });
  el.querySelector('.inv-lab').addEventListener('dblclick',function(e){e.preventDefault();apply(0,true)});
  /* native range already moves with the arrow keys when focused; keep the bar open while they do */
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='Home'||e.key==='End')open();
  });

  ['pointerdown','pointermove','pointerup','pointercancel','mousedown','mouseup','click','dblclick','touchstart','touchmove','touchend','wheel','keydown'].forEach(function(t){
    el.addEventListener(t,function(e){e.stopPropagation()});
  });
  window.GJ_INVERT={get:function(){return parseFloat(vis.style.getPropertyValue('--inv'))||0},set:function(v){apply(v,true)},el:el,input:inp};
})();
</script>
