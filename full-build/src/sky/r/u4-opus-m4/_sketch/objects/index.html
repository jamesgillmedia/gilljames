<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>objects · 2.5D sketch</title>
<meta name="theme-color" content="#04070b">
<link rel="icon" href="../../icons/apple-touch-icon.png">
<style>
@font-face{font-family:Poppins;font-weight:300;font-display:swap;src:url(../../media/pro2/fonts/poppins-300.woff2) format("woff2")}
@font-face{font-family:"Julius Sans One";font-display:swap;src:url(../../media/pro2/fonts/julius-sans-one.woff2) format("woff2")}
@font-face{font-family:Syl;font-weight:700;font-display:block;src:url(../../media/pro2/fonts/noto-canadian-aboriginal-subset.woff2) format("woff2");unicode-range:U+1400-167F}
:root{--icon-k:1;--tx:1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#04070b;color:#e9eef5;font:300 calc(13px*var(--tx))/1.4 Poppins,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden}
#stage.down{cursor:grabbing}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
#glow{position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(255,226,190,.16),rgba(255,226,190,.05) 40%,transparent 68%)}
#cam{position:absolute;inset:0;perspective:900px;perspective-origin:50% 46%;pointer-events:none}
#world{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.plane{position:absolute;left:0;top:0;overflow:hidden;background:#0a1016;backface-visibility:hidden;
 -webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
.plane.ring{transform-origin:0 0}
#ctx{transform-origin:50% 50%}
.plane.card{-webkit-mask-image:none;mask-image:none;border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.plane img{position:absolute;display:block;max-width:none;pointer-events:none}
#gal{position:absolute;inset:0;z-index:2;background:#04070b;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(72px + env(safe-area-inset-top)) 6px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain;transform-origin:50% 50%}
#gal h2{margin:14px 10px 0;font:400 calc(26px*var(--tx))/1.15 "Julius Sans One",sans-serif;letter-spacing:.08em;text-transform:lowercase}
#gal .sub{margin:6px 10px 2px;color:#9fb0c4;font-size:calc(12px*var(--tx))}
#gal .pinch{margin:0 10px 14px;color:#e9eef5;font-size:calc(12px*var(--tx));font-weight:300}
.cutgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px 16px;padding:4px 6px 48px}
@media (orientation:landscape),(min-width:700px){.cutgrid{grid-template-columns:repeat(3,1fr)}}
.cutgrid figure{margin:0;cursor:pointer}
.cutgrid figure:nth-child(3n){transform:translate(6px,6px)}
.cutgrid figure:nth-child(3n+1){transform:translate(-4px,0)}
.cutgrid img{width:100%;display:block;object-fit:contain;max-height:48vh;background:transparent;filter:drop-shadow(0 16px 14px rgba(0,0,0,.6))}
.cutgrid figcaption{margin-top:6px;font-size:calc(10px*var(--tx));color:#7f93a8;letter-spacing:.04em}
#hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
#hud select{font:inherit;font-size:calc(12px*var(--tx));color:#e9eef5;background:rgba(10,16,24,.5);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 10px;min-height:34px;max-width:none;flex:0 0 auto;-webkit-appearance:none;appearance:none}
#hud select option{background:#0a1016;color:#e9eef5}
#hud #reset{margin-left:auto}
#hud .sig{font-family:Syl,"Noto Sans Canadian Aboriginal",sans-serif;font-weight:700;font-size:calc(16px*var(--icon-k));color:#fff;text-decoration:none;padding:6px 6px;line-height:1}
#hud h1{font:200 calc(14px*var(--tx))/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.14em;text-transform:lowercase;margin-right:auto;text-shadow:0 1px 8px #000;pointer-events:none}
#hud button{font:inherit;font-size:calc(13px*var(--tx));color:#e9eef5;background:rgba(10,16,24,.62);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:8px 14px;min-height:36px;cursor:pointer}
#hud button[aria-pressed=true]{background:rgba(255,226,190,.2);border-color:rgba(255,226,190,.7)}
#hud button[hidden]{display:none}
#hud #tilt{min-height:28px;padding:4px 11px;font-size:calc(11px*var(--tx));letter-spacing:.08em;color:#9fb0c4;background:rgba(10,16,24,.22);border-color:rgba(255,255,255,.14)}
#hud #tilt[aria-pressed=true]{color:#cfe0f2;background:rgba(255,226,190,.12);border-color:rgba(255,226,190,.45)}
#foot{position:fixed;left:0;right:0;bottom:0;padding:0 14px max(14px,env(safe-area-inset-bottom));text-align:center;color:#9fb0c4;font-size:calc(12px*var(--tx));z-index:3;pointer-events:none;text-shadow:0 1px 8px #000,0 0 14px #04070b,0 0 22px #04070b}
#foot b{color:#e9eef5;font-weight:300}
/*DBG:CSS:BEGIN*/
#dbg{position:fixed;z-index:60;left:0;top:0;width:0;height:0;pointer-events:none;font:300 11px/1.35 Poppins,system-ui,sans-serif;color:#dfe8f2}
#dbg .tab{position:fixed;right:8px;bottom:max(8px,env(safe-area-inset-bottom));width:30px;height:30px;border-radius:50%;pointer-events:auto;cursor:pointer;padding:0;
 border:1px solid rgba(255,255,255,.28);background:rgba(10,16,24,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#cfe0f2;
 font:400 10px/28px "Julius Sans One",Poppins,sans-serif;text-align:center;letter-spacing:0;transition:opacity .25s ease-out,width .25s ease-out,height .25s ease-out}
#dbg:not(.on) .tab{width:16px;height:16px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));opacity:.32;border-color:rgba(255,255,255,.4)}
#dbg:not(.on) .tab span{display:none}
#dbg:not(.on) .tab::before{content:"";position:absolute;inset:-14px}
#dbg:not(.on) .tab::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#ffe9cf}
#dbg.open .tab{opacity:0;pointer-events:none}
#dbg .sheet{position:fixed;display:none;pointer-events:none;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;
 background:rgba(10,16,24,.26);-webkit-backdrop-filter:blur(5px) saturate(1.1);backdrop-filter:blur(5px) saturate(1.1);
 border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px 12px;
 left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-height:42vh;
 transform:translateY(calc(100% + 24px));opacity:0;transition:transform .25s ease-out,opacity .25s ease-out,background .25s ease-out}
#dbg.on .sheet{display:block}
#dbg.open .sheet{transform:none;opacity:1;pointer-events:auto}
@media (orientation:landscape) and (min-width:560px){
 #dbg .sheet{left:auto;right:max(8px,env(safe-area-inset-right));width:min(340px,42vw);max-height:68vh;transform:translateX(calc(100% + 24px))}
 #dbg.open .sheet{transform:none}
}
#dbg .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:400 10px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.16em;text-transform:lowercase;color:#9fb0c4}
#dbg .hd b{font-weight:400;margin-right:auto}
#dbg .hd a,#dbg .hd button{font:inherit;color:#cfe0f2;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 9px;text-decoration:none;cursor:pointer;letter-spacing:.08em}
#dbg .rowc,#dbg .info,#dbg .sec,#dbg .hd,#dbg .list{transition:opacity .25s ease-out}
#dbg.drag .sheet{background:rgba(10,16,24,.12)}
#dbg.drag .rowc:not(.act),#dbg.drag .info,#dbg.drag .sec,#dbg.drag .hd,#dbg.drag .list{opacity:.15}
#dbg .sec{margin:8px 0 3px;font:400 9px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.18em;color:#6f8399;text-transform:lowercase}
#dbg .info{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:10px;color:#b9c8d8}
@media (orientation:portrait){#dbg .info{grid-template-columns:auto 1fr auto 1fr}}
#dbg .info span:nth-child(odd){color:#6f8399}
#dbg .info span:nth-child(even){font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#dbg .rowc{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:8px;padding:3px 0;position:relative}
#dbg .rowc label{font-size:10px;color:#9fb0c4;white-space:nowrap}
#dbg .rowc label small{color:#6f8399}
#dbg .rowc .nb{font:300 10px/1 Poppins,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#e9eef5;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:4px 5px;width:100%;text-align:right;min-width:0}
#dbg .rowc .nb:focus{outline:none;border-color:rgba(255,226,190,.7)}
#dbg input[type=number]::-webkit-inner-spin-button{display:none}
#dbg input[type=number]{-moz-appearance:textfield}
#dbg input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0;touch-action:none}
#dbg .det input[type=range]{background:linear-gradient(rgba(207,224,242,.55),rgba(207,224,242,.55)) 50% 50%/1px 9px no-repeat}
#dbg input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(207,224,242,.38)}
#dbg input[type=range]::-moz-range-track{height:1px;background:rgba(207,224,242,.38)}
#dbg input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;margin-top:-5.5px;background:#ffe9cf;box-shadow:0 0 9px 2px rgba(255,226,190,.55)}
#dbg input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#ffe9cf;box-shadow:0 0 9px 2px rgba(255,226,190,.55)}
#dbg input[type=range]:focus{outline:none}
#dbg input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 10px 3px rgba(255,226,190,.7)}
#dbg .dial{grid-column:1 / -1;display:flex;justify-content:flex-end;gap:6px;height:0;opacity:0;overflow:hidden;transition:height .22s ease-out,opacity .22s ease-out,margin .22s ease-out;margin:0}
#dbg .rowc.dialon .dial{height:28px;opacity:1;margin:2px 0 2px}
#dbg .dial button{font:300 10px/1 Poppins,system-ui,sans-serif;color:#dfe8f2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:7px;min-width:42px;height:26px;cursor:pointer;font-variant-numeric:tabular-nums}
#dbg .seg{grid-column:2 / 4;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
#dbg .seg button{height:30px;padding:0 9px;white-space:nowrap;border:0;background:transparent;color:#9fb0c4;font:400 10px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.14em;cursor:pointer}
#dbg .seg button[aria-pressed=true]{color:#55DAA1}
#dbg .seg i{font-style:normal;color:#5d6f84;font-size:10px}
#dbg .list{font-size:10px;color:#9fb0c4;max-height:96px;overflow:auto}
#dbg .list div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gjview{position:fixed;inset:0;overflow:hidden}
#gjfog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;mix-blend-mode:screen;display:none}
#gjinv{position:absolute;inset:0;pointer-events:none;z-index:20;mix-blend-mode:difference;background:#000;display:none;transition:background-color .2s ease-out}
#gjgrain{position:fixed;left:0;top:0;width:calc(100vw + 256px);height:calc(100vh + 256px);pointer-events:none;z-index:50;display:none;mix-blend-mode:overlay;background-repeat:repeat;background-size:128px 128px;will-change:transform}
/*DBG:CSS:END*/
</style>
</head>
<body>
<div id="gjview">
<div id="gal" aria-label="gallery"></div>
<div id="stage" aria-label="2.5D object sketch: one finger orbits, two fingers resize, tilt the phone to look around">
<canvas id="sky" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>
<div id="cam"><div id="ctx" class="plane card" hidden><img alt=""></div><div id="world"></div></div>
</div>
<header id="hud">
<button type="button" id="back" hidden aria-label="back one level">&#8249;</button>
<a class="sig" id="sig" href="../../" lang="cr" aria-label="home">ᑕᐣᓯ</a>
<h1 id="ttl">joio cup</h1>
<select id="objsel" aria-label="object"></select>
<button type="button" id="tilt" hidden aria-pressed="false" aria-label="tilt off, tap to turn on">tilt</button>
<button type="button" id="reset" hidden>reset</button>
</header>
<p id="foot"><b id="hint"></b></p>
</div>
<script>
/*DBG:JS:BEGIN*/
window.GJDBG=(function(){
var Q=new URLSearchParams(location.search);
var on=Q.get('debug')==='1',cfg=null,root=null,sheet=null,infoEl=null,listEl=null,ctl={},vals={};
var open=false,idleT=0,dragN=0,fps=60,ft=16.7,lastT=0,uiT=0,grainOn=false,grainEl=null;
var LOOK=[
  {id:'br',label:'brightness',min:-100,max:100,step:.1,def:0,param:'br',detent:1.2,group:'look'},
  {id:'ct',label:'contrast',min:-100,max:100,step:.1,def:0,param:'ct',detent:1.2,group:'look'},
  {id:'gr',label:'grain',min:0,max:100,step:.1,def:0,param:'gr',group:'look'},
  {id:'inv',label:'invert',min:0,max:100,step:.1,def:0,param:'inv',group:'look'},
  {id:'sf',label:'star flash',min:0,max:100,step:.1,def:0,param:'sf',group:'look'},
  {id:'af',label:'ambient flash',min:0,max:100,step:.1,def:0,param:'af',group:'look'},
  {id:'bpm',label:'test beat',unit:'bpm',min:60,max:180,step:.1,def:100,param:'bpm',group:'flash beat'},
  {id:'sync',label:'sync',min:0,max:100,step:.1,def:0,param:'sync',group:'flash beat',ls:'gj.sync'}
];
var LOOKIDS={br:1,ct:1,gr:1,inv:1,sf:1,af:1,bpm:1,sync:1};
function isLook(k){return !!LOOKIDS[k.id]}
var beatAcc=0,beatSrc=null,fogEl=null,fogG=null,invEl=null,fogLevel=1,fogT=0,fogBlobs=null;
function dec(step){var s=String(step),i=s.indexOf('.');return i<0?0:s.length-i-1}
function r(v,step){return +(+v).toFixed(Math.max(dec(step),0))}
function setP(k,v,def){
  var u=new URL(location.href);
  if(v===null||v===undefined||(def!==undefined&&String(v)===String(def)))u.searchParams.delete(k);else u.searchParams.set(k,String(v));
  try{history.replaceState(history.state,'',u.pathname+u.search+u.hash)}catch(e){}
}
function getNum(k,def){var v=Q.get(k);if(v===null||v==='')return def;v=parseFloat(v);return isFinite(v)?v:def}
function applyLook(){
  var view=document.getElementById('gjview');
  var br=vals.br||0,ct=vals.ct||0,iv=(vals.inv||0)/100;
  /* invert is a grey difference layer: |c - v| is the image at 0, a strong invert at 1 (capped at 0.8 and eased with sin so the top is gentle, not pure white) and a solarised, still-coloured graphic between; a hue sweep that returns to 0 at both ends adds the colour shift */
  var hue=iv>0?Math.sin(iv*Math.PI)*140:0;
  if(view){
    view.style.filter=(br||ct||iv)?'brightness('+(1+br/100*.8).toFixed(4)+') contrast('+(1+ct/100*.7).toFixed(4)+')'+(iv?' hue-rotate('+hue.toFixed(2)+'deg)':''):'';
  }
  if(invEl){
    var gv=Math.round(Math.sin(iv*Math.PI/2)*.8*255);
    invEl.style.display=iv>0?'block':'none';
    invEl.style.backgroundColor='rgb('+gv+','+gv+','+gv+')';
  }
  var gr=vals.gr||0;
  grainOn=gr>0;
  if(grainEl){
    grainEl.style.display=grainOn?'block':'none';
    grainEl.style.opacity=(gr/100*.8).toFixed(3);
  }
}
function makeGrain(){
  grainEl=document.createElement('div');grainEl.id='gjgrain';grainEl.setAttribute('aria-hidden','true');
  var c=document.createElement('canvas');c.width=c.height=256;
  var x=c.getContext('2d'),d=x.createImageData(256,256),i,s=1234567;
  for(i=0;i<d.data.length;i+=4){s=(s*1664525+1013904223)>>>0;var v=s>>>24;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);
  grainEl.style.backgroundImage='url('+c.toDataURL()+')';
  document.body.appendChild(grainEl);
}
function makeView(){
  var view=document.getElementById('gjview');if(!view)return;
  fogEl=document.createElement('canvas');fogEl.id='gjfog';fogEl.width=128;fogEl.height=72;fogEl.setAttribute('aria-hidden','true');
  fogG=fogEl.getContext('2d');
  var hud=document.getElementById('hud');
  view.insertBefore(fogEl,hud&&hud.parentNode===view?hud:null);
  invEl=document.createElement('div');invEl.id='gjinv';invEl.setAttribute('aria-hidden','true');
  view.appendChild(invEl);
}
/* ---- shared beat, star flash and ambient flash ----
   The beat is a continuous count driven by the bpm slider (or by setBeat(fn) when a sketch has a real song).
   Pulse timing never reads the sliders for intensity: sf and af only scale what the pulse draws. */
function frac(x){return x-Math.floor(x)}
function beatCount(){return beatSrc?beatSrc():beatAcc}
function pulse(pos){
  var off=(vals.sync||0)/100*.9*Math.max(0,Math.min(1,pos||0));
  var ph=frac(beatCount()-off);
  return ph<.05?ph/.05:Math.exp(-(ph-.05)*4.2);
}
function flash(pos){var f=(vals.sf||0)/100;return f>0?f*pulse(pos):0}
function drawFog(t){
  if(!fogEl)return;
  var af=(vals.af||0)/100;
  if(af<=0){if(fogEl.style.display!=='none')fogEl.style.display='none';return}
  fogEl.style.display='block';
  var w=fogEl.width,h=fogEl.height,g=fogG;
  g.clearRect(0,0,w,h);g.globalCompositeOperation='lighter';
  var N=6,i;
  for(i=0;i<N;i++){
    var ang=i*2.39996+t*.00005*(i%2?1:-1),rad=i===0?0:.2+.05*i;
    var fx=.5+Math.cos(ang)*rad*1.1,fy=.5+Math.sin(ang)*rad*.8;
    var pos=Math.min(1,Math.hypot(fx-.5,(fy-.5)*1.6)/.62);
    var e=pulse(pos),lv=af*(.3+.7*e)*fogLevel;
    var col=i%2?'160,190,240':'85,218,161',R=w*(.55+.06*Math.sin(t*.0004+i));
    var gr=g.createRadialGradient(fx*w,fy*h,0,fx*w,fy*h,R);
    gr.addColorStop(0,'rgba('+col+','+(lv*.42).toFixed(3)+')');gr.addColorStop(.5,'rgba('+col+','+(lv*.14).toFixed(3)+')');gr.addColorStop(1,'rgba('+col+',0)');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
  }
  g.globalCompositeOperation='source-over';
}
function allControls(){return LOOK.concat(cfg.controls||[])}
function init(c){
  cfg=c;
  allControls().forEach(function(k){
    if(k.kind==='seg'||k.kind==='bool'){vals[k.id]=Q.get(k.param)!==null?Q.get(k.param):k.def}
    else{
      var v0=getNum(k.param,NaN);
      if(!isFinite(v0)&&k.ls){try{v0=parseFloat(localStorage.getItem(k.ls))}catch(e){}}
      if(!isFinite(v0))v0=k.def;
      vals[k.id]=Math.max(k.min,Math.min(k.max,v0));
    }
  });
  makeGrain();makeView();applyLook();
  allControls().forEach(function(k){
    if(!isLook(k)&&k.onChange&&!k.noInit&&(Q.get(k.param)!==null||k.always))k.onChange(vals[k.id],true)
  });
  build();
  document.addEventListener('pointerdown',function(e){if(open&&root&&!root.contains(e.target))close()},true);
  requestAnimationFrame(loop);
}
function enable(){on=true;setP('debug','1');root.classList.add('on');openPanel()}
function disable(){on=false;setP('debug',null);close();root.classList.remove('on')}
function build(){
  root=document.createElement('div');root.id='dbg';if(on)root.classList.add('on');
  var h='<button type="button" class="tab" aria-label="debug panel"><span>dbg</span></button><div class="sheet" role="region" aria-label="debug panel"><div class="hd"><b>debug</b><a href="'+(cfg.versions||'../../_versions/')+'">builds</a><button type="button" data-x aria-label="turn debug off">off</button></div>';
  var groups={},order=[];
  allControls().forEach(function(k){
    var grp=k.group||'controls';
    if(!groups[grp]){groups[grp]=[];order.push(grp)}
    groups[grp].push(k);
  });
  order.sort(function(a,b){var o={variant:0,size:1,look:2,'flash beat':3};return (o[a]==null?1:o[a])-(o[b]==null?1:o[b])});
  order.forEach(function(gn){
    h+='<div class="sec">'+gn+'</div>';
    groups[gn].forEach(function(k){h+=ctlHtml(k)});
  });

    var p={el:el,im:im,spec:sp,i:i,ar:1.25,n:normal(sp),f:0,op:-1};
    im.addEventListener('load',function(){p.ar=im.naturalHeight/im.naturalWidth;placePlanes()});
    planes.push(p);
  });
  placePlanes();
}
function mountGallery(){
  var h='<h2>'+cur.title+'</h2><p class="sub">'+cur.views.length+' photographs · '+cur.note+'</p><p class="pinch">pinch in, or tap a photograph, to go into it</p><div class="cutgrid">';
  cur.views.forEach(function(it,i){h+='<figure data-i="'+i+'"><img src="'+P+(it.th||it.s)+'" alt="'+it.n+'" loading="lazy"><figcaption>'+it.n+'</figcaption></figure>'});
  gal.innerHTML=h+'</div>';
  gal.scrollTop=0;
}
function mountObject(key){
  curKey=key;cur=OBJECTS[key];

  $('ttl').textContent='';
  $('objsel').value=key;

}
function heroView(){
  for(var i=0;i<cur.views.length;i++)if(cur.views[i].hero)return cur.views[i];
  return cur.views[0];
}
function faceTo(sp,hard){
  var ty=-sp.az;
  ty+=360*Math.round((T.yaw-ty)/360);

}
function resetView(hard){
  T.px=T.py=0;T.scale=1;

  faceTo(heroView(),hard);
}

function showLayer(n){

  gal.style.pointerEvents=n===1?'auto':'none';
  stage.style.visibility=n===2?'visible':'hidden';
  stage.style.pointerEvents=n===2?'auto':'none';
  $('reset').hidden=n!==2;
  $('tilt').hidden=!tiltOK;
  $('back').hidden=n===BASE;
  $('foot').hidden=n===1;
  $('hint').textContent=n===1?'':'drag to orbit · pinch to resize · pinch out to return to the gallery';
  document.documentElement.setAttribute('data-layer',String(n));
}
var BASE=OPT===1?1:2,tiltOK=false;
function layerGo(to,ox,oy,instant){
  if(PL.on||to===LAYER)return;
  if(to!==BASE){try{history.pushState({L:to},'',location.href)}catch(e){}}
  else if(history.state&&history.state.L&&history.state.L!==BASE){try{history.back();return}catch(e){}}
  startPulse(to,ox,oy,instant);
}
function startPulse(to,ox,oy,instant){
  if(instant){showLayer(to);return}
  PL.on=1;PL.t0=performance.now();PL.from=LAYER;PL.to=to;PL.ox=ox==null?W/2:ox;PL.oy=oy==null?H/2:oy;PL.applied=0;PL.e=0;
  if(to===2){S.entry=-320}
}
function viewScale(e){
  if(e<.38){var k=e/.38;return 1+1.2*(1-Math.pow(1-k,2))}
  var k2=(e-.38)/.62;return 1.1-.1*(1-Math.pow(1-k2,3));
}
function pulseStep(t){
  if(!PL.on)return;
  var u=Math.min(1,(t-PL.t0)/DUR),e=1-Math.pow(1-u,3);PL.e=e;
  if(!PL.applied&&e>=.38){PL.applied=1;showLayer(PL.to)}
  var el=PL.applied?(PL.to===1?gal:stage):(PL.from===1?gal:stage);
  var sv=viewScale(e),op=e<.38?1-clamp((e-.2)/.18,0,1):clamp((e-.38)/.22,0,1);
  el.style.transformOrigin=PL.ox+'px '+PL.oy+'px';
  el.style.transform='scale('+sv.toFixed(4)+')';
  el.style.opacity=op.toFixed(3);
  if(u>=1){PL.on=0;gal.style.transform='';gal.style.opacity='';stage.style.transform='';stage.style.opacity='';S.entry=0}
}

function onDown(e){
  if(e.target.closest('#hud')||LAYER!==2)return;
  ptr[e.pointerId]={x:e.clientX,y:e.clientY};ptrN=Object.keys(ptr).length;
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  stage.classList.add('down');
  if(ptrN===1){gest={mode:'orbit',lx:e.clientX,ly:e.clientY};gesture='orbit (1 finger)'}
  if(ptrN===2)startPinch();
  V.yaw=V.pitch=0;spinW=0;
}
function startPinch(){
  var k=Object.keys(ptr),a=ptr[k[0]],b=ptr[k[1]];
  gest={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,s0:T.scale,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};gesture='resize (2 fingers)';
}
function onMove(e){
  if(!ptr[e.pointerId]){
    if(e.pointerType==='mouse'&&!tilt.on&&LAYER===2){tilt.tx=(e.clientX/W-.5)*2;tilt.ty=(e.clientY/H-.5)*2}
    return;
  }
  ptr[e.pointerId]={x:e.clientX,y:e.clientY};
  if(!gest)return;
  if(gest.mode==='orbit'&&ptrN===1){
    var dx=e.clientX-gest.lx,dy=e.clientY-gest.ly;
    gest.lx=e.clientX;gest.ly=e.clientY;
    T.yaw=T.yaw+dx*.24;T.pitch=clamp(T.pitch-dy*.2,-86,14);
    V.yaw=dx*.24;V.pitch=-dy*.2;
  }else if(gest.mode==='pinch'&&ptrN>=2){
    var k=Object.keys(ptr),a=ptr[k[0]],b=ptr[k[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,raw=gest.s0*d/gest.d;
    if(raw<.5){gest=null;resetPtr();layerGo(1,mx,my);return}
    T.scale=clamp(raw,.55,2.8);
    T.px=clamp(T.px+(mx-gest.mx),-W*.7,W*.7);T.py=clamp(T.py+(my-gest.my),-H*.7,H*.7);
    gest.mx=mx;gest.my=my;
  }
}
function resetPtr(){ptr={};ptrN=0;stage.classList.remove('down');gesture='none'}
function onUp(e){
  if(!ptr[e.pointerId])return;
  delete ptr[e.pointerId];ptrN=Object.keys(ptr).length;
  if(ptrN===1){var k=Object.keys(ptr)[0];gest={mode:'orbit',lx:ptr[k].x,ly:ptr[k].y};gesture='orbit (1 finger)'}
  if(ptrN===0){gest=null;gesture='none';stage.classList.remove('down')}
}
function onWheel(e){
  if(LAYER!==2)return;
  e.preventDefault();
  var raw=T.scale*Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016));
  if(raw<.5){layerGo(1,e.clientX,e.clientY);return}
  T.scale=clamp(raw,.55,2.8);spinW=0;
}
var GP={};
function galDown(e){
  if(LAYER!==1||PL.on)return;
  GP[e.pointerId]={x:e.clientX,y:e.clientY};
  var k=Object.keys(GP);
  if(k.length===2){var a=GP[k[0]],b=GP[k[1]];GP.g={d:Math.hypot(a.x-b.x,a.y-b.y)||1,done:0};gesture='pinch (gallery)'}
}
function galMove(e){
  if(!GP[e.pointerId])return;
  GP[e.pointerId]={x:e.clientX,y:e.clientY};
  var k=Object.keys(GP).filter(function(x){return x!=='g'});
  if(k.length<2||!GP.g||GP.g.done)return;
  var a=GP[k[0]],b=GP[k[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
  if(d/GP.g.d>1.18){GP.g.done=1;layerGo(2,(a.x+b.x)/2,(a.y+b.y)/2)}
}
function galUp(e){delete GP[e.pointerId];if(Object.keys(GP).filter(function(x){return x!=='g'}).length<2){delete GP.g;gesture='none'}}
function galTap(e){
  var f=e.target.closest('figure');if(!f||LAYER!==1)return;
  var v=cur.views[+f.getAttribute('data-i')];
  if(v&&!v.ctx&&!PL.on)faceTo(v,true);
  var r=f.getBoundingClientRect();layerGo(2,r.left+r.width/2,r.top+r.height/2);
}

var TILT_KEY='gjObjTilt';
function tiltStore(v){try{sessionStorage.setItem(TILT_KEY,v)}catch(e){}}
function tiltPressed(on){var b=$('tilt');b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'tilt on, tap to turn off':'tilt off, tap to turn on')}
function tiltListen(){window.addEventListener('deviceorientation',onOri,true)}
/* Only the tilt button calls this, from its own click. Nothing else asks for motion permission. */
function enableTilt(){
  var D=window.DeviceOrientationEvent;
  function ok(){tiltListen();tilt.on=true;tilt.ref=null;tiltPressed(true);tiltStore('1')}
  function no(){tilt.on=false;tiltPressed(false);tiltStore('0')}
  if(D&&typeof D.requestPermission==='function'){
    D.requestPermission().then(function(r){r==='granted'?ok():no()}).catch(no);
  }else ok();
}
function disableTilt(){
  window.removeEventListener('deviceorientation',onOri,true);
  tilt.on=false;tilt.tx=tilt.ty=0;tiltPressed(false);tiltStore('0');
}
/* Session memory: if tilt was on, listen again without asking. Where permission is needed (iOS) and was not kept, no events arrive and the button stays off until tapped. */
function tiltRestore(){
  var v=null;try{v=sessionStorage.getItem(TILT_KEY)}catch(e){}

}
function onOri(e){
  if(e.beta==null||e.gamma==null)return;
  if(!tilt.on){tilt.on=true;tilt.ref=null;tiltPressed(true)}
  var ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0,b=e.beta,gm=e.gamma,x,y;
  if(ang===90){x=b;y=-gm}else if(ang===270||ang===-90){x=-b;y=gm}else if(ang===180){x=-gm;y=-b}else{x=gm;y=b}
  if(!tilt.ref)tilt.ref={x:x,y:y};
  tilt.tx=clamp((x-tilt.ref.x)/28,-1,1);
  tilt.ty=clamp((y-tilt.ref.y)/28,-1,1);
}

var FACE=null;
function facing(ry,rx){
  var a=ry*Math.PI/180,b=rx*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),best=-2,bi=-1;
  for(var i=0;i<planes.length;i++){
    var p=planes[i];if(p.ctx)continue;
    var n=p.n,x1=n[0]*ca+n[2]*sa,z1=-n[0]*sa+n[2]*ca,z2=n[1]*sb+z1*cb;
    p.f=z2;
    if(z2>best){best=z2;bi=i}
    var u=clamp((z2-.72)/.26,0,1),op=.12+.88*(u*u*(3-2*u));
    if(Math.abs(op-p.op)>.01){p.op=op;p.el.style.opacity=op.toFixed(3)}
  }
  FACE=bi;
  if(ctxView){
    ctxEl.style.transform='translate3d('+(Math.sin(a)*H*.05).toFixed(1)+'px,0,-'+(RING_R*U*1.7).toFixed(0)+'px)';
  }
}
var lastT=0;
function frame(t){
  var dt=Math.min(.05,(t-(lastT||t))/1000);lastT=t;
  pulseStep(t);
  var touching=ptrN>0;
  if(!touching){
    T.yaw=T.yaw+V.yaw;T.pitch=clamp(T.pitch+V.pitch,-86,14);
    V.yaw*=Math.pow(1e-5,dt);V.pitch*=Math.pow(1e-5,dt);
    if(Math.abs(V.yaw)<.01)V.yaw=0;if(Math.abs(V.pitch)<.01)V.pitch=0;
  }
  var spinOn=OPT===2&&LAYER===2&&!touching&&!PL.on;
  spinW+=((spinOn?1:0)-spinW)*(1-Math.exp(-dt*(spinOn?.8:6)));
  spinT+=dt*spinW;
  var spin=spinT*12;
  var kw=1-Math.exp(-dt*(touching?14:2.2));tilt.w+=((touching?0:1)-tilt.w)*kw;
  var kt=1-Math.exp(-dt*7);tilt.x+=(tilt.tx-tilt.x)*kt;tilt.y+=(tilt.ty-tilt.y)*kt;
  var ks=1-Math.exp(-dt*16);
  S.yaw+=(T.yaw-S.yaw)*ks;S.pitch+=(T.pitch-S.pitch)*ks;S.scale+=(T.scale-S.scale)*ks;
  S.px+=(T.px-S.px)*ks;S.py+=(T.py-S.py)*ks;
  if(S.entry){S.entry*=Math.pow(.02,dt);if(Math.abs(S.entry)<1)S.entry=0}
  var ry=S.yaw+spin+tilt.x*tilt.w*20,rx=S.pitch-tilt.y*tilt.w*14;
  world.style.transform='translate3d('+S.px.toFixed(1)+'px,'+S.py.toFixed(1)+'px,'+(S.entry||0).toFixed(1)+'px) scale('+S.scale.toFixed(4)+') rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
  var gl=$('glow');gl.style.transform='translate('+(-Math.sin(ry*.0174533)*80).toFixed(1)+'px,'+(Math.sin(rx*.0174533)*80).toFixed(1)+'px) scale('+(.8+S.scale*.2).toFixed(3)+')';
  S.ry=ry;S.rx=rx;
  facing(ry,rx);
  drawSky(t);
  requestAnimationFrame(frame);
}

function onPop(e){
  var L=(e.state&&e.state.L)||BASE;
  if(L!==LAYER&&!PL.on)startPulse(L,W/2,H/2,false);
}
function route(){
  var k=(location.hash||'').replace('#','');
  if(!OBJECTS[k])k='cup';
  mountObject(k);
}
function f(v,d){return (+v).toFixed(d==null?2:d)}
function init(){
  makeStars();layout();
  tiltOK=!!(window.DeviceOrientationEvent&&('ontouchstart' in window||navigator.maxTouchPoints>0));
  addEventListener('resize',layout);
  stage.addEventListener('pointerdown',onDown);
  stage.addEventListener('pointermove',onMove);
  stage.addEventListener('pointerup',onUp);
  stage.addEventListener('pointercancel',onUp);
  stage.addEventListener('wheel',onWheel,{passive:false});
  stage.addEventListener('touchmove',function(e){if(e.cancelable)e.preventDefault()},{passive:false});
  gal.addEventListener('pointerdown',galDown);
  gal.addEventListener('pointermove',galMove);
  gal.addEventListener('pointerup',galUp);
  gal.addEventListener('pointercancel',galUp);
  gal.addEventListener('click',galTap);
  var sel=$('objsel');sel.innerHTML=ORDER.map(function(k){return '<option value="'+k+'">'+OBJECTS[k].title+'</option>'}).join('');
  sel.addEventListener('change',function(){location.hash=sel.value});
  $('reset').addEventListener('click',function(){resetView(false)});
  $('back').addEventListener('click',function(){if(history.state&&history.state.L&&history.state.L!==BASE)history.back();else layerGo(BASE===1?1:2)});
  addEventListener('keydown',function(e){if(e.key==='Escape'&&LAYER!==BASE)history.back()});
  $('tilt').addEventListener('click',function(){tilt.on?disableTilt():enableTilt()});
  addEventListener('popstate',onPop);
  addEventListener('hashchange',function(){route();showLayer(BASE)});
  route();showLayer(BASE);tiltPressed(false);tiltRestore();
  var root=document.documentElement;
  GJDBG.init({
    versions:'../../_versions/',
    controls:[
      {id:'opt',label:'option',kind:'seg',opts:[['1','option 1'],['2','option 2']],def:'1',param:'opt',group:'variant',noInit:true,
        onChange:function(v){var u=new URL(location.href);u.searchParams.set('opt',v);location.href=u.pathname+u.search+u.hash}},
      {id:'icon',label:'icon size',unit:'%',min:50,max:200,step:.1,def:100,param:'icon',group:'size',always:1,onChange:function(v){root.style.setProperty('--icon-k',(v/100).toFixed(4))}},
      {id:'txt',label:'text size',unit:'%',min:50,max:200,step:.1,def:100,param:'txt',group:'size',always:1,onChange:function(v){root.style.setProperty('--tx',(v/100).toFixed(4))}}
    ],
    rows:function(){
      return [
        ['layer',LAYER+(LAYER===1?' · gallery':' · 3D constellation')],['phase',PL.on?'transition':'idle'],
        ['option',String(OPT)+(OPT===1?' · gallery first':' · 3D first')],['object',curKey],
        ['icon px',f(16*(GJDBG.val('icon')||100)/100,1)+' px'],['pinch depth (e)',f(PL.on?PL.e:(LAYER===2?1:0),3)],['scale',f(S.scale,3)],
        ['orbit yaw / pitch',f(S.ry||0)+' / '+f(S.rx||0)],['tilt x / y / w',f(tilt.x,3)+' / '+f(tilt.y,3)+' / '+f(tilt.w,2)+(tilt.on?'':' (off)')],
        ['touches',String(ptrN+Object.keys(GP).filter(function(x){return x!=='g'}).length)],['gesture',gesture]
      ];
    },
    list:function(){return planes.map(function(p,i){return i+' · '+p.spec.n+(p.ctx?' · context card':' · az '+p.spec.az+' el '+p.spec.el+' · face '+f(p.f,2)+(i===FACE?' *':''))})}
  });
  requestAnimationFrame(frame);
}
window.GJ_OBJ3D={mount:mountObject,state:S,target:T,tilt:tilt,objects:OBJECTS,reset:resetView,go:layerGo,get layer(){return LAYER}};
init();
})();
