<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#04070b">
<title>Gill James · ᑕᐣᓯ</title><link rel="icon" href="img/favicon-32.png">
<link rel="preload" href="fonts/poppins-300.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Poppins";font-weight:300;font-display:swap;src:url(fonts/poppins-300.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:200;font-display:swap;src:url(fonts/poppins-200.woff2) format("woff2")}
@font-face{font-family:"Julius Sans One";font-display:swap;src:url(fonts/julius-sans-one.woff2) format("woff2")}
@font-face{font-family:"Syl";font-weight:700;font-display:block;src:url(fonts/noto-canadian-aboriginal-subset.woff2) format("woff2");unicode-range:U+1400-167F}
:root{--bg:#04070b;--mint:#55DAA1;--ink:#eef3f5;--dim:#c9d3d6;--meta:#93a1a6;--line:rgba(255,255,255,.18);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
font:300 14px/1.5 Poppins,"Syl",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 8px) 10px 0 max(10px,var(--sl));pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.mark{background:none;border:0;padding:6px;margin:0;color:var(--ink);cursor:pointer;display:grid;place-items:center;min-width:44px;min-height:44px}
.mark img{width:50px;height:27px;display:block;filter:drop-shadow(0 0 6px rgba(150,190,255,.35))}
.back{font:300 13px/1 Poppins,sans-serif;color:var(--ink);background:rgba(4,7,11,.55);border:1px solid var(--line);border-radius:22px;padding:0 14px;min-height:40px;cursor:pointer;letter-spacing:.04em}
.back[hidden]{display:none}
.crumb{font:300 12px/1.2 Poppins,sans-serif;color:var(--meta);letter-spacing:.06em;margin:0 0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{font-weight:300;color:var(--ink)}
.lb{position:fixed;left:0;top:0;z-index:3;pointer-events:none;font:200 15px/1 "Julius Sans One",Poppins,sans-serif;letter-spacing:.18em;color:var(--ink);text-transform:lowercase;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 10px #04070b}
.lb small{display:block;font:300 10px/1.4 Poppins,sans-serif;letter-spacing:.1em;color:var(--meta);text-align:center;margin-top:3px}
.lb.sel{color:var(--mint)}
.hint{position:fixed;left:50%;bottom:calc(var(--sb) + 22px);transform:translateX(-50%);z-index:6;font:300 12px/1.45 Poppins,sans-serif;color:var(--dim);background:rgba(4,7,11,.7);border:1px solid var(--line);border-radius:18px;padding:8px 14px;text-align:center;max-width:92vw;transition:opacity .5s;pointer-events:none}
.hint b{color:var(--mint);font-weight:300}.hint.off{opacity:0}
.info{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:16px 16px calc(var(--sb) + 18px);background:linear-gradient(transparent,rgba(4,7,11,.92) 38%);transform:translateY(100%);transition:transform .45s ease;pointer-events:none}
.info.on{transform:none;pointer-events:auto}
.info h2{margin:0;font:300 19px/1.25 Poppins,sans-serif}.info p{margin:3px 0 0;color:var(--meta);font-size:12px;letter-spacing:.05em}
.info .new{color:var(--mint)}
.info a{display:inline-block;margin:10px 14px 0 0;color:var(--mint);text-decoration:none;border-bottom:1px solid rgba(85,218,161,.4);padding:4px 0}
.err{position:fixed;left:12px;bottom:12px;z-index:9;font:300 12px Poppins,sans-serif;color:#ffb4a8;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:8px}
@media (min-width:760px){.info{left:auto;right:24px;bottom:24px;width:380px;border-radius:14px;background:rgba(4,7,11,.8);border:1px solid var(--line)}}
</style></head><body>
<canvas id="c" aria-label="Gill James: a galaxy of work. Tap a star system once to select, again to fly in."></canvas>
<div class="top"><button class="mark" type="button" aria-label="home: the whole galaxy"><img src="mark.svg" alt="ᑕᐣᓯ"></button><button class="back" type="button" hidden aria-label="back out one level">← back</button><p class="crumb" aria-live="polite"><b>galaxy</b></p></div>
<div id="labels"></div>
<p class="hint">tap a star <b>once</b> to choose · <b>again</b> to fly in<br>pinch or scroll to move deeper</p>
<section class="info" aria-live="polite"><h2></h2><p></p><div class="lk"></div></section>
<noscript><p class="err">this galaxy needs JavaScript</p></noscript>
<script type="module" src="js/world.js?v=1"></script>
<script>setTimeout(function(){if(!window.__world){var e=document.createElement('p');e.className='err';e.textContent='the 3D galaxy could not start on this browser';document.body.appendChild(e)}},6000)</script>
</body></html>
