<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Starfield · gill james direction v2</title>
<link rel="stylesheet" href="base.css">
<style>
body{overflow:hidden;height:100vh}
.sky{position:fixed;inset:0;background:#02040a url(assets/water.jpg) center/cover;filter:brightness(.78) contrast(1.5) saturate(.5) hue-rotate(185deg)}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 52% 46%,rgba(40,70,110,.35),transparent 60%),linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.65))}
#world{position:fixed;inset:0;transform-origin:50% 50%}
svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.lines line{stroke:rgba(200,225,235,.28);stroke-width:1}
svg.lines circle.orbit{fill:none;stroke:rgba(200,225,235,.10);stroke-dasharray:2 5}
.star{position:absolute;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 18px rgba(170,215,255,.28);background:#111}
.star img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15)}
.star.film{border-radius:2px;aspect-ratio:2.39}
.star.dot{background:#e8f2ff;box-shadow:0 0 10px 2px rgba(200,230,255,.7)}
.clab{position:absolute;transform:translate(-50%,0);font-family:var(--d);font-size:13px;letter-spacing:.32em;text-transform:uppercase;white-space:nowrap;color:#e9f0ef}
.clab small{display:block;font-family:var(--f);font-weight:200;font-size:10px;letter-spacing:.24em;color:#8e9b99;text-align:center;margin-top:4px;text-transform:lowercase}
.near .clab{font-size:16px}
.cap{position:absolute;transform:translate(-50%,0);font-size:9.5px;letter-spacing:.12em;color:#b8c3c1;white-space:nowrap;text-transform:lowercase}
.pole{position:absolute;transform:translate(-50%,-50%);text-align:center}
.pole .sig{font-size:76px;color:#fff;filter:drop-shadow(0 0 22px rgba(160,210,255,.45))}
.pole p{margin:14px 0 0;font-family:var(--d);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#dfe7e6}
.pole .roles{font-family:var(--f);font-weight:200;font-size:9.5px;letter-spacing:.3em;color:#8c9897;margin-top:8px}
.badge{position:absolute;transform:translate(-50%,-50%);font-size:9px;letter-spacing:.14em;color:#000;background:var(--mint);padding:3px 8px;border-radius:99px;white-space:nowrap}
header{position:fixed;inset:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;padding:22px 26px;z-index:5;align-items:start}
header .wm{font-size:20px;justify-self:center;text-align:center}
.tools{justify-self:end;display:flex;gap:10px;align-items:center}
.pill{font-size:10.5px;letter-spacing:.16em;color:#d5dcdb;padding:9px 14px;border-radius:99px;background:rgba(16,20,26,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);backdrop-filter:blur(6px);text-transform:lowercase}
.zoom{position:fixed;left:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
.zoom button{width:36px;height:36px;border-radius:50%;border:0;background:var(--btn);color:#cfd6d5;font:300 16px var(--f)}
.zoom .lvl{font-size:9px;letter-spacing:.16em;color:#7f8b8a;text-align:center;margin-top:6px;font-family:ui-monospace,monospace}
.mm{position:fixed;right:26px;bottom:26px;width:118px;height:118px;border-radius:50%;z-index:5;background:#05070b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);overflow:hidden}
.mm::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 36% 50%,transparent 0 56%,rgba(225,232,236,.16) 57%)}
.mm i{position:absolute;width:3px;height:3px;border-radius:50%;background:#cfe0ea}
.mm b{position:absolute;left:46%;top:52%;width:30px;height:20px;border:1px solid var(--mint);transform:translate(-50%,-50%)}
.hint{position:fixed;right:170px;bottom:30px;z-index:5;font-size:10px;letter-spacing:.22em;color:#8d9a98;text-transform:lowercase;white-space:nowrap}
.lab{position:fixed;left:26px;top:96px;z-index:5}
@media (max-width:600px){
 header{padding:14px;grid-template-columns:1fr auto}
 header .wm{justify-self:start;text-align:left;font-size:18px}
 .tools .pill.d{display:none}
 .zoom{left:14px;top:auto;bottom:84px;transform:none;flex-direction:row;align-items:center}
 .zoom button{width:34px;height:34px}.zoom .lvl{margin:0 0 0 4px}
 .mm{display:none}
 .hint{left:auto;right:14px;bottom:94px;font-size:8.5px;letter-spacing:.1em;text-align:right;white-space:normal;width:150px;line-height:1.5}
 .lab{display:none}
 .listbtn{position:fixed;left:14px;right:14px;bottom:20px;z-index:5;text-align:center;padding:14px;border-radius:99px;background:rgba(16,20,26,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);font-size:11px;letter-spacing:.2em;color:#e3eae9}
 .pole .sig{font-size:50px}.pole p{font-size:10px;white-space:nowrap;margin-top:10px}.pole .roles{display:none}
 .clab{font-size:11px;letter-spacing:.24em}.near .clab{font-size:12px}
 .clab small{font-size:8.5px;letter-spacing:.14em}
}
@media (min-width:601px){.listbtn{display:none}}
</style></head><body>
<div class="sky" aria-hidden="true"></div>
<main id="world" aria-label="Zoomable night sky of Gill's work. Use the zoom buttons, or read as a list."></main>
<header>
 <a class="wm" href="#"><span class="a">gill</span><span class="b">james</span></a>
 <div class="tools"><a class="pill d" href="#poem">the poem</a><a class="pill" href="#list">read as a list</a></div>
</header>
<div class="zoom" role="group" aria-label="zoom"><button aria-label="zoom in">+</button><button aria-label="zoom out">−</button><button aria-label="whole sky">◌</button><div class="lvl">lod 1</div></div>
<div class="mm" aria-hidden="true"></div>
<p class="hint">scroll or pinch to zoom · drag to drift · double-tap a star to open it</p>
<a class="listbtn" href="#list">read as a list ↓</a>
<span class="tag lab">concept C · starfield</span>
<div class="vig"></div><div class="grain"></div>
<script>
var mob=innerWidth<600, W=document.getElementById('world');
// cluster centres in % of viewport (desktop / phone poster layout)
var C=[
 {k:'film',lab:'film',sub:'36 films',d:[20,30],m:[32,27],stars:[['s-window',0,0,92],['s-boxer',-70,-46,58],['s-candles',62,-56,52],['s-fire',84,40,46],['s-eyes',-58,58,44],['s-bmw',10,82,40]]},
 {k:'photo',lab:'photo',sub:'black + white',d:[16,70],m:[25,48],stars:[['cup-hand',0,0,64],['brush',-62,-40,40],['latte',66,-30,38],['spoon2',50,48,34],['cup-glaze',-44,52,30]]},
 {k:'art',lab:'art',sub:'carving · ceramics',d:[76,24],m:[73,37],stars:[['carve',0,0,60],['spoon',62,26,40],['cup-rim',-60,30,44],['moon',20,-50,30]]},
 {k:'music',lab:'music',sub:'Mothers Moniker · Lost Coffee',d:[86,54],m:[66,73],stars:[['moonloop',0,0,54],['purple',-56,-28,30],[null,40,44,8],[null,-30,50,6],[null,62,-18,7]]},
 {k:'joio',lab:'joio.co',sub:'coffee goods',d:[62,67],m:[28,66],near:1,stars:[['cup-top',0,0,96,'cup'],['cup-moss',-104,8,62,'planter cup'],['cup-glaze',94,-30,58,'glaze'],['cup',40,74,50,'B&W cup']]},
 {k:'spatial',lab:'spatial',sub:'design',d:[36,79],m:[74,55],stars:[['pavilion-night',0,0,58],['materials',-56,-14,36],['wire',52,-24,34],['boards',30,40,30]]}
];
var svg='<svg class="lines" aria-hidden="true">';
var html='';var vw=innerWidth,vh=innerHeight,S=mob?.56:1;
var pole=mob?[50,12.5]:[50,46];
C.forEach(function(c){var p=mob?c.m:c.d,cx=p[0]/100*vw,cy=p[1]/100*vh,pts=[];
 c.stars.forEach(function(s,i){var x=cx+s[1]*S*(c.near&&!mob?1.25:1),y=cy+s[2]*S*(c.near&&!mob?1.25:1),r=s[3]*S*(c.near&&!mob?1.25:1);pts.push([x,y]);
  if(!s[0])html+='<span class="star dot" style="left:'+x+'px;top:'+y+'px;width:'+r+'px;height:'+r+'px"></span>';
  else if(c.k==='film')html+='<span class="star film" style="left:'+x+'px;top:'+y+'px;width:'+(r*1.6)+'px"><img src="assets/'+s[0]+'.jpg" alt=""></span>';
  else html+='<span class="star" style="left:'+x+'px;top:'+y+'px;width:'+r+'px;height:'+r+'px"><img src="assets/'+s[0]+'.jpg" alt=""></span>';
  if(c.near&&s[4]&&!mob)html+='<span class="cap" style="left:'+x+'px;top:'+(y+r/2+6)+'px">'+s[4]+'</span>';});
 for(var i=1;i<pts.length;i++){var a=pts[i<3?0:i-2],b=pts[i];svg+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>'}
 var ly=cy+(mob?(c.near?50:(c.k==='film'?60:40)):(c.near?150:(c.k==='film'?122:96)));
 html+='<div class="'+(c.near?'near':'')+'"><span class="clab" style="left:'+cx+'px;top:'+ly+'px">'+c.lab+'<small>'+c.sub+'</small></span></div>';
 if(c.k==='joio'&&!mob)html+='<span class="badge" style="left:'+(cx)+'px;top:'+(cy-78)+'px">tap to rotate in 3D</span>';
 svg+='<line style="stroke:rgba(200,225,235,.07)" x1="'+pole[0]/100*vw+'" y1="'+pole[1]/100*vh+'" x2="'+cx+'" y2="'+cy+'"/>';
});
svg+='<circle class="orbit" cx="'+pole[0]/100*vw+'" cy="'+pole[1]/100*vh+'" r="'+(mob?150:210)+'"/></svg>';
html+='<div class="pole" style="left:'+pole[0]+'%;top:'+pole[1]+'%"><div class="sig breathe" lang="cr">ᑕᐣᓯ</div><p class="off">Artistry a starfield I chase</p><p class="roles">cinematographer + artist + spatial designer</p></div>';
W.innerHTML=svg+html;
// minimap dots
var mm=document.querySelector('.mm');C.forEach(function(c){var i=document.createElement('i');i.style.left=(c.d[0]*.8+10)+'%';i.style.top=(c.d[1]*.8+10)+'%';mm.appendChild(i)});mm.appendChild(document.createElement('b'));
</script>
</body></html>
